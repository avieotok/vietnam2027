<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>וייטנאם יום אחר יום</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: a fixed 1280x720 "film frame" scaled to the width of the page, controls underneath. One committed dark look. */
:root{
  --ink:#0d2421; --ink2:#12302c; --cream:#f6efe0; --cream2:#cfd9d3; --jade:#4fbfa4; --lantern:#f0773f; --gold:#e8b84a; --sky1:#f7c58e; --sky2:#7fb3c8;
  --display:"Frank Ruhl Libre","David",Georgia,serif; --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--body);margin:0;direction:rtl}
.page{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
h1.pt{font-family:var(--display);font-size:clamp(24px,4vw,36px);margin:0 0 4px}
.pt-sub{color:var(--cream2);margin:0 0 14px;font-size:16px}
#wrap{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--ink);direction:rtl}
.scene{position:absolute;inset:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ctrl button{font:inherit;font-weight:700;font-size:16px;background:var(--ink2);color:var(--cream);border:1px solid #2c4a45;border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
.ctrl button.main{background:var(--lantern);border-color:var(--lantern);color:#1b0f08}
.ctrl button:focus-visible,.chips button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{flex:1 1 200px;height:8px;background:#21403b;border-radius:4px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:var(--jade)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{font:inherit;font-size:14px;font-weight:600;background:transparent;color:var(--cream2);border:1px solid #2c4a45;border-radius:8px;padding:5px 10px;cursor:pointer;min-height:36px}
.chips button[aria-current="true"]{background:var(--jade);color:var(--ink);border-color:var(--jade)}
.note{color:var(--cream2);font-size:14px;margin-top:10px}
.paused *, .paused *::before, .paused *::after{animation-play-state:paused !important}
body.rec .page{padding:0;max-width:none}
body.rec .ctrl, body.rec .chips, body.rec .note, body.rec h1.pt, body.rec .pt-sub{display:none}
body.rec #wrap{border-radius:0}

/* ---------- shared animation helpers ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%{r:10;opacity:.9}100%{r:34;opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.fu{opacity:0;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) forwards}
.fi{opacity:0;animation:fadeIn 1s ease forwards}

/* ---------- title ---------- */
.t-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,#1d4a42 0%,var(--ink) 60%)}
.lan{position:absolute;width:70px;height:92px;border-radius:46% 46% 40% 40%;background:radial-gradient(circle at 50% 40%,#ffd38a,var(--lantern) 55%,#a83a14);box-shadow:0 0 50px 10px rgba(240,119,63,.35);animation:float 6s ease-in-out infinite}
.lan::before,.lan::after{content:"";position:absolute;left:50%;width:30px;height:8px;margin-left:-15px;background:#5a2a10;border-radius:3px}
.lan::before{top:-6px}.lan::after{bottom:-6px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}
.t-txt{position:absolute;right:110px;top:190px;text-align:right}
.t-txt .k{font-size:28px;color:var(--jade);font-weight:800;letter-spacing:.04em}
.t-txt h1{font-family:var(--display);font-weight:900;font-size:150px;line-height:1;margin:10px 0 18px;color:var(--cream)}
.t-txt p{font-size:34px;margin:0;color:var(--cream2)}
.t-txt p b{color:var(--gold)}

/* ---------- flight map ---------- */
.fl-map{position:absolute;inset:0}
.fl-map .land{fill:#1c3a35;stroke:#2c544c;stroke-width:1}
.fl-map .il{fill:var(--lantern)} .fl-map .vn{fill:var(--jade)}
.fl-arc{fill:none;stroke:var(--gold);stroke-width:4;stroke-dasharray:14 12;opacity:.9}
.fl-plane{offset-path:var(--p);offset-rotate:auto;animation:fly 6.5s 1s cubic-bezier(.45,.05,.55,.95) forwards;offset-distance:0%}
@keyframes fly{to{offset-distance:100%}}
.cap{position:absolute;background:rgba(13,36,33,.86);border:1px solid #2c544c;border-radius:16px;padding:18px 26px;text-align:right}
.cap .k{font-size:22px;font-weight:800;color:var(--jade);letter-spacing:.03em}
.cap .h{font-family:var(--display);font-size:52px;font-weight:900;line-height:1.1;margin-top:4px}
.cap .s{font-size:26px;color:var(--cream2);margin-top:6px}
.lbl{font-family:var(--display);font-weight:900;font-size:30px;fill:var(--cream);paint-order:stroke;stroke:var(--ink);stroke-width:6px}

/* ---------- landing ---------- */
.ld-sky{position:absolute;inset:0;background:linear-gradient(#5f9cb8 0%,#a9cbd2 45%,var(--sky1) 72%,#f3d9a8 100%)}
.ld svg{position:absolute;inset:0}
.cloud{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1500px)}}
.plane{animation:land 11s .3s cubic-bezier(.3,.1,.3,1) forwards;transform:translate(-460px,40px) scale(.45) rotate(5deg)}
@keyframes land{
  0%{transform:translate(-460px,40px) scale(.45) rotate(5deg)}
  55%{transform:translate(380px,428px) scale(.95) rotate(4deg)}
  66%{transform:translate(560px,470px) scale(1) rotate(-3deg)}
  72%{transform:translate(660px,478px) scale(1) rotate(0deg)}
  100%{transform:translate(1500px,478px) scale(1) rotate(0deg)}}
.gear{transform-box:fill-box;transform-origin:top center;transform:scaleY(0);animation:gear 1.2s 3.6s ease-out forwards}
@keyframes gear{to{transform:scaleY(1)}}
.puff{opacity:0;animation:puff 1.6s 7.6s ease-out forwards}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-80px,-30px) scale(2.2)}}
.rwl{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- day scenes ---------- */
.d-map{position:absolute;left:24px;top:24px;width:520px;height:672px}
.d-map .vnp{fill:#173a34;stroke:var(--jade);stroke-width:1.5}
.d-map .nbp{fill:#1b2f2b;stroke:#35514b;stroke-width:1}
.seg{fill:none;stroke:var(--lantern);stroke-width:4;stroke-linecap:round}
.seg.fly{stroke:var(--cream2);stroke-dasharray:3 9;stroke-width:3.5}
.seg.new{animation:draw 2.2s .3s ease-in-out forwards}
.st{fill:var(--cream2)} .st.on{fill:var(--gold)}
.ring{fill:none;stroke:var(--gold);stroke-width:3;animation:pulse 1.8s ease-out infinite}
.slbl{font-family:var(--body);font-weight:800;font-size:22px;fill:var(--cream2);paint-order:stroke;stroke:var(--ink);stroke-width:6px}
.slbl.on{fill:var(--gold);font-size:30px;font-family:var(--display);font-weight:900}
.d-card{position:absolute;right:56px;top:34px;width:640px;text-align:right}
.d-chip{display:inline-flex;gap:12px;align-items:center;background:var(--jade);color:var(--ink);font-weight:800;font-size:24px;border-radius:999px;padding:6px 20px}
.d-chip span{opacity:.75;font-weight:700}
.d-t{font-family:var(--display);font-weight:900;font-size:62px;line-height:1.05;margin:12px 0 4px}
.d-w{font-size:24px;color:var(--cream2);margin-bottom:18px;line-height:1.35}
.d-w b{color:var(--gold)}
.acts{display:grid;gap:11px}
.act{display:grid;grid-template-columns:100px 1fr;gap:16px;align-items:start;background:rgba(255,255,255,.04);border:1px solid #24453f;border-radius:14px;padding:11px 18px}
.act .tm{font-weight:800;font-size:20px;color:var(--jade);padding-top:4px}
.act .nm{font-weight:800;font-size:27px;line-height:1.25}
.act .ex{font-size:21px;color:var(--cream2);margin-top:2px;line-height:1.35}
.alt{margin-top:16px;border:2px dashed var(--lantern);border-radius:14px;padding:12px 18px;background:rgba(240,119,63,.08)}
.alt .k{color:var(--lantern);font-weight:800;font-size:21px}
.alt .v{font-size:23px;margin-top:2px;line-height:1.35}

/* ---------- end ---------- */
.e-txt{position:absolute;right:70px;top:150px;width:600px;text-align:right}
.e-txt h2{font-family:var(--display);font-weight:900;font-size:76px;line-height:1.05;margin:0 0 20px}
.e-txt p{font-size:30px;color:var(--cream2);margin:0 0 14px;line-height:1.4}
.e-txt p b{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.cloud,.lan{animation:none}}
</style>
</head>
<body>

<div class="page">
  <h1 class="pt">וייטנאם יום אחר יום</h1>
  <p class="pt-sub">סרטון של כ־4 דקות: הטיסה, הנחיתה, וכל יום בטיול עם מפה, הסבר על השמות והחלופות.</p>
  <div id="wrap"><div id="stage"></div></div>
  <div class="ctrl">
    <button id="bPrev" type="button">הקודם</button>
    <button id="bPlay" type="button" class="main">השהיה</button>
    <button id="bNext" type="button">הבא</button>
    <button id="bRe" type="button">מההתחלה</button>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  </div>
  <div class="chips" id="chips"></div>
  <p class="note">אפשר לעצור בכל רגע כדי לקרוא, או לקפוץ ישירות ליום מסוים בכפתורים למעלה.</p>
</div>

const merc=(lo,la)=>[lo*Math.PI/180,Math.log(Math.tan(Math.PI/4+la*Math.PI/360))];
function fitter(b,W,H){const [x0,y0]=merc(b[0],b[1]),[x1,y1]=merc(b[2],b[3]);const s=Math.min(W/(x1-x0),H/(y1-y0));const ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;
  return (lo,la)=>{const [x,y]=merc(lo,la);return [ox+(x-x0)*s, H-oy-(y-y0)*s];};}
const pth=(rings,pr)=>rings.map(rg=>'M'+rg.map(p=>pr(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join('L')+'Z').join('');
function segPath(a,b,mode,pr){const p=pr(ST[a][1],ST[a][2]),q=pr(ST[b][1],ST[b][2]);
  if(mode==='fly'){const mx=(p[0]+q[0])/2+ (q[1]-p[1])*0.18, my=(p[1]+q[1])/2-(q[0]-p[0])*0.18; return `M${p[0]},${p[1]}Q${mx},${my} ${q[0]},${q[1]}`;}
  return `M${p[0]},${p[1]}L${q[0]},${q[1]}`;}
const len=(d)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',d);try{return e.getTotalLength()||600}catch(x){return 600}};

function dayMap(idx,south){
  const W=520,H=672, b= south?[102.2,8.5,109.6,23.4]:[102.3,14.9,109.4,23.3];
  const pr=fitter(b,W,H);
  let s=`<svg class="d-map" viewBox="0 0 ${W} ${H}" style="direction:ltr"><rect width="${W}" height="${H}" rx="18" fill="#0a2a33"/><path class="nbp" d="${pth(VNG.NB,pr)}"/><path class="vnp" d="${pth(VNG.VN,pr)}"/>`;
  const visited=new Set(['H']);
  const all=[]; if(south){ [['H','N','road'],['H','L','road'],['H','D','fly'],['D','A','road'],['A','U','road']].forEach(sg=>all.push([...sg,false])); }
  else DAYS.slice(0, idx+1).forEach((d,i)=>d.segs.forEach(sg=>all.push([...sg, i===idx])));
  all.forEach(([a,c,m,isNew])=>{visited.add(a);visited.add(c);const d=segPath(a,c,m,pr);
    s+= isNew?`<path class="seg ${m} new" d="${d}" style="stroke-dasharray:${m==='fly'?'3 9':len(d)};stroke-dashoffset:${len(d)}${m==='fly'?';animation:none;opacity:0;animation:fadeIn 1.5s .5s forwards':''}"/>`:`<path class="seg ${m}" d="${d}"/>`;});
  if(south){ ['G','B'].forEach(k=>visited.add(k)); const d1=segPath('U','G','fly',pr), d2=segPath('G','B','road',pr), d3=segPath('G','H','fly',pr);
    s+=`<path class="seg fly" d="${d1}" style="opacity:0;animation:fadeIn 1.5s .4s forwards"/><path class="seg new" d="${d2}" style="stroke-dasharray:${len(d2)};stroke-dashoffset:${len(d2)};animation-delay:1.6s"/><path class="seg fly" d="${d3}" style="opacity:0;animation:fadeIn 1.5s 3s forwards"/>`; }
  const cur = south?'G':DAYS[idx].at;
  [...visited].filter(k=>k!=='V'&&k!=='D').forEach(k=>{const [x,y]=pr(ST[k][1],ST[k][2]);const on=k===cur;
    s+= on?`<circle class="ring" cx="${x}" cy="${y}" r="10"/><circle class="st on" cx="${x}" cy="${y}" r="10" style="transform-box:fill-box;transform-origin:center;animation:pop .6s 1.6s both"/>`:`<circle class="st" cx="${x}" cy="${y}" r="7"/>`;
    const LP={H:[-14,-12,'end'],S:[14,-14,'start'],N:[-14,22,'end'],L:[0,40,'middle'],A:[16,24,'start'],U:[-16,-6,'end'],G:[16,-6,'start'],B:[-14,24,'end']};
    const [dx,dy,an]=LP[k]||[14,8,'start'];
    s+=`<text class="slbl${on?' on':''}" x="${x+dx}" y="${y+dy}" text-anchor="${an}">${ST[k][0]}</text>`;});
  return s+`</svg>`;
}

}

// ---------- player ----------
const stage=document.getElementById('stage'), wrap=document.getElementById('wrap');
let cur=0, playing=true, timer=null, t0=0, left=0, raf=0;
const REC = window.REC===1 || /rec/.test(location.search); if(REC) document.body.classList.add('rec');
function fit(){const w=wrap.clientWidth; const s=w/1280; stage.style.transform=`scale(${s})`; wrap.style.height=(720*s)+'px';}
addEventListener('resize',fit);
function chips(){document.getElementById('chips').innerHTML=SCENES.map((s,i)=>`<button type="button" data-i="${i}" aria-current="${i===cur}">${s.name}</button>`).join('');}
function show(i,keepPaused){
  cur=Math.max(0,Math.min(SCENES.length-1,i)); clearTimeout(timer);
  stage.innerHTML=`<div class="scene">${SCENES[cur].html()}</div>`;
  left=SCENES[cur].dur; chips();
  if(playing){stage.classList.remove('paused');schedule();} else stage.classList.add('paused');
  progress();
}
function schedule(){t0=performance.now();clearTimeout(timer);timer=setTimeout(()=>{ if(cur<SCENES.length-1) show(cur+1); else {playing=false;btn();stage.classList.add('paused'); if(REC) window.DONE=1;} },left);}
function progress(){cancelAnimationFrame(raf);const tot=SCENES.reduce((a,s)=>a+s.dur,0);const before=SCENES.slice(0,cur).reduce((a,s)=>a+s.dur,0);
  const step=()=>{const el=SCENES[cur].dur-(playing?Math.max(0,left-(performance.now()-t0)):left);document.getElementById('prog').style.width=((before+el)/tot*100)+'%';raf=requestAnimationFrame(step);};step();}
function btn(){document.getElementById('bPlay').textContent=playing?'השהיה':(cur===SCENES.length-1&&left<=0?'לנגן שוב':'המשך');}
document.getElementById('bPlay').onclick=()=>{ if(playing){playing=false;left=Math.max(0,left-(performance.now()-t0));clearTimeout(timer);stage.classList.add('paused');}
  else{ playing=true; if(left<=0||document.getElementById('bPlay').textContent==='לנגן שוב'){show(0);} else {stage.classList.remove('paused');schedule();} } btn();};
document.getElementById('bNext').onclick=()=>show(cur+1);
document.getElementById('bPrev').onclick=()=>show(cur-1);
document.getElementById('bRe').onclick=()=>{playing=true;btn();show(0);};
document.getElementById('chips').onclick=e=>{const b=e.target.closest('button[data-i]');if(b){show(+b.dataset.i);}};
fit(); show(0); btn();
</script>

</body>
