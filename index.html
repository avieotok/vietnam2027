const LONG = {"Hoan Kiem Lake Hanoi": {"hist": ["אגם הואן קיאם הוא שריד של פיתול ישן של הנהר האדום, שנותק מהנהר לפני מאות שנים והפך לאגם סגור בלב העיר. בעבר נקרא \"אגם המים הירוקים\", בגלל צבע המים. את שמו הנוכחי, \"אגם החרב המוחזרת\", קיבל מאגדה מהמאה ה־15.", "לפי האגדה, בתקופה שבה סין של שושלת מינג שלטה בווייטנאם, דייג בשם לה לוי מצא להב חרב קסום, ובהמשך גם ידית מתאימה. עם החרב הוביל מרד של עשר שנים, גירש את הסינים ב־1428 והכתיר את עצמו לקיסר לה טאי טו, מייסד שושלת לה. זמן קצר אחר כך שט בסירה על האגם. צב זהב ענק עלה מן המים וביקש את החרב בחזרה בשם \"מלך הדרקונים\", והקיסר החזיר אותה. מאז, הצב הוא סמל של האגם ושל העצמאות הווייטנאמית.", "האגדה קיבלה המשך מפתיע במציאות: באגם חיו צבי מים מתוקים ענקיים ממין נדיר מאוד. הצב האחרון, שתושבי העיר ראו בו צאצא של צב האגדה, מת ב־2016. גופתו המשומרת מוצגת במקדש נגוק סון, לצד צב אחר שנמצא ב־1968."], "uniq": ["האגם הוא הלב הרגשי והחברתי של האנוי. כל המרחקים בעיר נמדדים ממנו, ולידו מתחילים התהלוכות והחגיגות. בשעות הבוקר המוקדמות, בערך בין 5:00 ל־7:00, המקום מתמלא בתושבים שעושים טאי צ׳י, ריקודי קבוצה, בדמינטון והליכה מהירה סביב האגם. זו אחת התמונות היפות והאותנטיות של העיר, ושווה לקום מוקדם בשבילה.", "מיום שישי בערב ועד יום ראשון בלילה הרחובות סביב האגם נסגרים לתנועה. משפחות, זוגות ונגני רחוב יוצאים לטייל, ונוצרת אווירה של פסטיבל."], "see": ["מקדש נגוק סון (\"מקדש הר הירקן\") על אי בצפון האגם, מהמאה ה־18. מוקדש לגיבור הלאומי טראן הונג דאו, שהביס את המונגולים במאה ה־13. הכניסה בתשלום סמלי.", "גשר טה הוק (\"גשר אור השמש\") האדום, שמוביל למקדש. בערב הוא מואר ויפה במיוחד לצילום.", "מגדל הצב, מבנה קטן על אי באמצע האגם מסוף המאה ה־19. רואים אותו רק מהגדה.", "מגדל העט והמגדל בכניסה למקדש. על המגדל כתוב בסינית קלאסית \"לכתוב על השמיים הכחולים\".", "בתי קפה בקומות עליונות בצד הצפוני, עם נוף לאגם ולכיכר. מקום טוב לשבת עם קפה ולצפות בתנועה."]}, "Hanoi Old Quarter": {"hist": ["האנוי נוסדה בשנת 1010, כשהקיסר לי טאי טו העביר לכאן את הבירה. לפי המסורת, כשהגיע ראה דרקון זהב עולה מן הנהר, ולכן קרא לעיר טאנג לונג, \"הדרקון העולה\". מחוץ לחומות הארמון הקיסרי צמח רובע של בעלי מלאכה וסוחרים, שבאו מהכפרים כדי לשרת את החצר.", "בעלי המלאכה מאותו כפר התיישבו יחד באותו רחוב, ובנו בו בית תפילה לאל הפטרון של המקצוע. כך נוצרו \"36 הרחובות\", כשכל רחוב נקרא על שם מה שמכרו בו: האנג באק (כסף), האנג מא (נייר וקישוטים), האנג דואנג (סוכר), האנג טיאק (פח). המילה \"האנג\" פירושה סחורה. גם היום רחובות רבים ממשיכים במסורת: ברחוב אחד מוכרים רק צעצועים, ובשני רק עששיות ונייר נגו."], "uniq": ["הבתים ברובע מכונים \"בתי צינור\": חזית צרה, לפעמים רק 2–3 מטרים, ועומק שיכול להגיע לעשרות מטרים. בעבר המס נקבע לפי רוחב החזית, ולכן בנו לעומק. בחזית נמצאת החנות, מאחוריה חצר פנימית קטנה, ומאחור ובקומות העליונות גרה המשפחה.", "הרובע הוא אחד המקומות שבהם הכי מרגישים את החיים האמיתיים של העיר. ארוחות על שרפרפים פלסטיק נמוכים על המדרכה, מוכרות עם כובעים משולשים ומוט על הכתף, אופנועים עמוסים בכל מה שאפשר לדמיין. זה רועש וצפוף, אבל גם מלא קסם."], "see": ["בית מספר 87 ברחוב מא מאי: בית סוחרים משוחזר מהמאה ה־19, שמראה איך נראה בית צינור מבפנים.", "שער העיר העתיק או קואן צ׳ואנג, השער היחיד שנשאר מחומות העיר.", "מקדש באך מא (\"הסוס הלבן\") ברחוב האנג בואום, מהמקדשים העתיקים של העיר.", "פינת הבירה בצומת טא היין ולואנג נגוק קוין: בירה מקומית טרייה (ביה הוי) בכמה אלפי דונג לכוס.", "שוק דונג שוואן, השוק המקורה הגדול בקצה הצפוני של הרובע."]}, "Temple of Literature Hanoi": {"hist": ["ואן מיו, מקדש הספרות, הוקם ב־1070 על ידי הקיסר לי טאנה טונג, והוקדש לקונפוציוס ולתלמידיו. שש שנים אחר כך, ב־1076, נפתחה לידו קווק טו ז׳אם, האקדמיה הלאומית, שנחשבת לאוניברסיטה הראשונה של וייטנאם. בהתחלה למדו בה רק בני משפחת המלוכה והאצולה. בהמשך נפתחה לתלמידים מוכשרים מכל הממלכה, שעברו בחינות מקומיות קשות.", "במשך יותר מ־700 שנה הכשירה האקדמיה את הפקידים, המלומדים והמשוררים של המדינה. כשהבירה עברה להואה בתחילת המאה ה־19, האקדמיה עברה איתה, והמקום נשאר כמקדש. ב־1442 החלו לחרוט על לוחות אבן את שמות הזוכים בתואר דוקטור בבחינות הקיסריות, מנהג שנמשך עד 1779."], "uniq": ["המתחם הוא אחד הדוגמאות היפות של אדריכלות וייטנאמית מסורתית שנשמרו. הוא בנוי כחמש חצרות ברצף, ממערב למזרח, ולכל אחת משמעות סמלית: מהעולם החיצון, דרך הלימוד, ועד לחכמה העליונה.", "בחצר השלישית, סביב בריכת \"באר האור השמימי\", עומדים 82 לוחות אבן על גבי צבי אבן. הצב מסמל אריכות ימים וחוכמה. על כל לוח חרותים שמות הבוגרים, מוצאם וכמה שאלות היו בבחינה. הלוחות הוכרזו ב־2010 כחלק מ\"זיכרון העולם\" של אונסק״ו. בעבר נהגו התלמידים לשפשף את ראשי הצבים לפני בחינות, וכדי לשמור עליהם זה אסור היום.", "עד היום תלמידים וסטודנטים באים לכאן לפני בחינות, מניחים פרחים ומבקשים הצלחה. בעונת סיום הלימודים (מאי–יוני) רואים כאן בוגרים בגלימות מצטלמים."], "see": ["שער ואן מיו בכניסה, עם כתובות בכתב סיני קלאסי.", "ביתן קואה ואן (\"כוכב הספרות\") מ־1805, מעל החצר השנייה. הוא סמל העיר האנוי ומופיע על שטר של 100,000 דונג.", "שורות הלוחות על הצבים סביב הבריכה.", "אולם הפולחן הגדול עם פסל קונפוציוס ופסלי תלמידיו.", "בחצר האחרונה, קומה עליונה עם פסלים של שלושה קיסרים שקידמו את החינוך, ותוף ופעמון גדולים."]}, "Vietnam Museum of Ethnology": {"hist": ["בווייטנאם מוכרות רשמית 54 קבוצות אתניות. הקבוצה הגדולה היא הקין (הווייטנאמים), כ־85% מהאוכלוסייה, ולצידה 53 מיעוטים, רובם באזורי ההרים בצפון ובמרכז. לכל קבוצה שפה, לבוש, אדריכלות ומנהגים משלה.", "המוזיאון נפתח ב־1997, כדי לתעד ולשמר את המגוון הזה ברגע שבו הפיתוח המהיר מאיים על אורח החיים המסורתי. מומחים מצרפת סייעו בהקמתו ובעיצוב התצוגות, והוא נחשב לאחד המוזיאונים הטובים בדרום־מזרח אסיה."], "uniq": ["בגן שמאחורי הבניין הקימו בני הקבוצות עצמם בתים אמיתיים בגודל מלא, בחומרים ובטכניקות מסורתיות. אפשר להיכנס אליהם, לעלות במדרגות העץ ולראות איך חיו בהם. אין עוד מקום בווייטנאם שבו רואים את כל המגוון הזה במקום אחד.", "המוזיאון מציג גם את ההווה: איך משפחות בכפרים משתמשות בטלפונים ניידים, איך משתנים טקסי חתונה, ומה קרה לחקלאות. ההסברים כתובים באנגלית ברורה, והמקום שקט, מוצל ונוח להליכה, מתאים לכל גיל."], "see": ["הבית הארוך של בני האדה מהרמה המרכזית, באורך של עשרות מטרים, שבו גרו כמה דורות של אותה משפחה. בני האדה הם חברה מטריארכלית, והבית שייך לנשים.", "בית הקהילה של בני הבהנאר, עם גג משולש שמתנשא לכ־19 מטר. זה המבנה הבולט בגן.", "בית הקבורה של בני הג׳ראי, עם פסלי עץ מגולפים של דמויות אבלות.", "בית על כלונסאות של בני הטאי, ובית אדמה של בני ההמונג, אותם המונג שתפגשו בסאפה.", "בבניין הראשי: תלבושות, כלי נגינה, כלי דיג וציד, וחפצי טקסים של כל הקבוצות."]}, "Thang Long Water Puppet Theatre": {"hist": ["תיאטרון בובות המים (מוא רוי נוק) הוא אמנות שמקורה בכפרים של דלתת הנהר האדום. כתובת אבן מהמאה ה־12 כבר מתארת מופע כזה בחצר המלך, כך שהאמנות בת יותר מאלף שנה.", "האיכרים הציגו בבריכות הכפר ובשדות האורז המוצפים, אחרי הקציר ובחגים. כל כפר שמר בסוד את הטכניקות שלו, והן עברו מאב לבן. המפעילים הקימו מבנה קטן על המים, ששימש כמסך ונקרא \"בית מקדש המים\". התיאטרון בהאנוי נוסד ב־1969, ובזכותו האמנות שרדה והפכה לסמל תרבותי מוכר בעולם."], "uniq": ["המים הם הבמה. המפעילים עומדים במים עד המותניים, מאחורי מסך במבוק, ומזיזים את הבובות במוטות ובחוטים ארוכים מתחת לפני המים. הקהל לא רואה אותם בכלל, ונראה כאילו הבובות זזות לבד, שוחות, רוקדות ואפילו יורקות אש. הבובות מגולפות מעץ תאנה קל ומצופות בלכה כדי לעמוד במים.", "בצד הבמה יושבת תזמורת חיה עם כלים מסורתיים, כמו הדאן באו, נבל בעל מיתר אחד, וזמרים שמספרים את הסיפור בסגנון צ׳או ואן העממי. הדמות הקבועה היא צ׳ו טאו, איכר שובב ומחויך שמציג את המופע ומעיר הערות על הדמויות."], "see": ["הסצנות הקבועות: עבודה בשדות האורז, דיג, ילדים רוכבים על תאו, מירוץ סירות וקרבות תרנגולים.", "ריקוד ארבע החיות הקדושות: הדרקון, החד־קרן, הצב והעוף החול.", "אגדת החרב של אגם הואן קיאם, עם צב הזהב שעולה מהמים.", "הנגנים בצד הבמה, שכדאי לצפות בהם גם כשהבובות לא על הבמה.", "בסוף המופע המפעילים יוצאים מאחורי המסך כשהם רטובים, ורק אז רואים את מי שעשה את כל זה."]}, "Hanoi to Sapa": {"hist": ["האזור של סאפה מיושב כבר מאות שנים בידי בני מיעוטים אתניים, בעיקר המונג השחורים, הדאו האדומים, הטאי והג׳איי, שהגיעו לכאן בגלים מדרום סין. הם עיבדו את מדרונות ההרים לטרסות אורז, וחיו בכפרים מבודדים כמעט בלי קשר לשפלה.", "ב־1918 הגיעו לכאן הצרפתים, ובשנות ה־20 וה־30 הפכו את סאפה לתחנת נופש הררית. פקידים ומשפחות ברחו לכאן מהחום הלח של האנוי, ובנו וילות, בית מלון, כנסייה ובית חולים. במלחמת העצמאות נגד צרפת ואחריה ננטשו ונהרסו רבים מהמבנים. בשנות ה־90 נפתח האזור לתיירות, והעיירה גדלה מאוד מאז."], "uniq": ["סאפה נמצאת בהרי הואנג ליין סון, קצה רכס ההימלאיה, בגובה של כ־1,500 עד 1,600 מטר. האקלים שונה לגמרי משאר וייטנאם: קריר, ערפילי ולפעמים אפילו קר, עם שלג נדיר בחורף. מכאן גם הנוף: עמקים עמוקים, פסגות, שדות אורז מדורגים ויער ערפל.", "מה שמייחד את סאפה הוא המפגש עם תרבויות ההרים. נשות ההמונג לובשות בגדים כהים צבועים באינדיגו, ונשות הדאו האדומים חובשות מטפחות אדומות גדולות ומגלחות את הגבות. רבות מהנשים מגיעות לעיר למכור רקמות, ותיירים רבים לנים בבתי משפחות בכפרים."], "see": ["הנסיעה עצמה: הכביש המהיר עובר לאורך הנהר האדום, ובקטע האחרון, מלאו קאי לסאפה, מטפס בפיתולים בין הרים וטרסות.", "העיר לאו קאי, שנמצאת על הגבול עם סין. מעבר לנהר רואים את העיר הסינית הקואו.", "מרכז העיירה: הכנסייה, הכיכר, אגם סאפה ושוק העיר.", "מחוץ לעיר: כפרי עמק מואנג הואה, כפר טא פין, ופסגת פנסיפן."]}, "Sapa Stone Church": {"hist": ["כנסיית האבן, ששמה הרשמי כנסיית מחרוזת התפילה הקדושה, נבנתה על ידי מיסיונרים צרפתים בתחילת המאה ה־20, כשסאפה הפכה לעיירת נופש. היא נבנתה מגושי אבן מקומיים שנחצבו בהרים, בסגנון גותי פשוט עם מגדל פעמונים מחודד.", "במשך הזמן היא נשארה אחד המבנים הצרפתיים המעטים בעיירה שלא נהרסו. היום היא עדיין כנסייה קתולית פעילה, עם מיסות בימי ראשון שמשתתפים בהן גם בני הקהילות המקומיות."], "uniq": ["הכנסייה היא סמל העיירה ומשמשת נקודת ציון: כל הרחובות מובילים אליה, ובכיכר שלפניה מתרכזים החיים. בבקרים ערפיליים היא מופיעה מתוך העננים, ובערב מוארת באורות.", "בכיכר נפגשים כל העולמות של סאפה: נשים מבני ההמונג והדאו מוכרות רקמות ותיקים, ילדים משחקים, תיירים מצטלמים, ובסופי שבוע יש מופעי ריקוד ומוזיקה של בני ההרים."], "see": ["הכנסייה מבחוץ ומבפנים, עם חלונות ויטראז׳ ותקרת עץ.", "אגם סאפה, כמה דקות הליכה משם: טיילת שטוחה סביב המים, נוח במיוחד להליכה רגועה.", "שוק סאפה, עם בדים, תבלינים, פטריות הרים ומאכלים מקומיים.", "מוזיאון סאפה הקטן ליד הכיכר, עם הסברים על הקבוצות האתניות של האזור.", "מסעדות עם \"סיר חם\" (lẩu) של דג סלמון או פטריות, המנה האהובה בעיירה הקרירה."]}, "Cat Cat village Sapa": {"hist": ["קאט קאט הוא כפר של בני ההמונג השחורים, שהתיישבו כאן כבר במאה ה־19. השם, לפי ההסבר המקומי, בא מהמילה הצרפתית cascade (מפל), בגלל המפל שבתחתית הכפר. בתקופה הצרפתית נבנתה ליד המפל תחנת כוח קטנה, שסיפקה חשמל לעיירת הנופש.", "במשך שנים חיו בני הכפר מגידול אורז ותירס על הטרסות ומאריגת בדים. מאז שנות ה־90, כשסאפה נפתחה לתיירות, הכפר הוא הקרוב והנגיש ביותר לעיר, והוא השתנה מאוד: הוסלל שביל, נבנו גשרים ונקודות צילום, ורבים מהבתים הפכו לחנויות."], "uniq": ["בני ההמונג השחורים נקראים כך בגלל הבגדים הכהים שהם לובשים, צבועים באינדיגו. בכפר רואים את כל תהליך ייצור הבד: גידול הקנבוס, פיצול הסיבים, הטוויה על פלך, האריגה על נול ידני, הצביעה בבורות של אינדיגו ועיטור בשעווה חמה (בטיק). לכן הידיים של הנשים המבוגרות לעיתים קרובות כחולות.", "הכפר מתויר מאוד, ולא כדאי לצפות לחוויה \"אמיתית\" לגמרי. בכל זאת, הנוף יפה, השביל מסודר ונוח, ובקצרה ובקלות מקבלים טעימה מהחיים בכפר."], "see": ["נשים אורגות וצובעות בפתחי הבתים.", "בית המונג מסורתי, עם אח בישול, מחסן תירס ומזבח לאבות.", "המפל, הגשר התלוי ותחנת הכוח הצרפתית הישנה.", "גלגלי מים מעץ, שמשמשים לטחינת אורז.", "מופע ריקוד וחליל של בני ההמונג בבמה ליד המפל, בשעות קבועות במהלך היום."]}, "Ta Van Lao Chai Sapa": {"hist": ["עמק מואנג הואה משתרע לאורך כ־20 ק״מ דרומית לסאפה, בין רכס פנסיפן לרכסים ממזרח. הטרסות שבו נחצבו במשך מאות שנים בעבודת ידיים, דור אחרי דור, ומשמשות עד היום לגידול אורז פעם בשנה. מערכת התעלות מובילה מים ממעיינות ההרים מטרסה לטרסה.", "בעמק פזורות כ־200 אבנים גדולות עם חריטות עתיקות: דמויות אדם, בתים, מפות, וסימנים שעדיין לא פוענחו. החוקרים חלוקים לגבי גילן ומי חרט אותן. יש הסוברים שהן בנות אלפי שנים. האתר מוגן ומוצע לרשימת המורשת של אונסק״ו."], "uniq": ["זה הנוף המפורסם של סאפה, שמופיע על כל גלויה: מדרגות של שדות אורז שמכסות את המדרונות כמו קווי גובה במפה. בכל עונה הנוף שונה. במרץ השדות עוד לא נשתלו, האדמה חומה, ואפשר לראות בבירור את צורת הטרסות ואת החקלאים מכינים אותן עם תאו. באפריל־מאי הטרסות מוצפות ונראות כמו מראות, בקיץ הן ירוקות, ובספטמבר צהובות לפני הקציר.", "לאו צ׳אי הוא כפר של בני ההמונג השחורים, וטא ואן כפר של בני הג׳איי, קבוצה קטנה יותר שלבושה בצבעים בהירים ובתיה בנויים על הקרקע. ההליכה ביניהם עוברת לאורך הנהר ובין השדות, והיא שקטה ואמיתית הרבה יותר מקאט קאט."], "see": ["נקודות התצפית לאורך הכביש לעמק. ברכב פרטי אפשר לעצור בכל אחת מהן.", "אתר האבנים החרוטות, ליד הכביש בין לאו צ׳אי לטא ואן.", "הליכה שטוחה וקצרה בתוך כפר טא ואן, וגשר התלוי מעל נהר מואנג הואה.", "ביקור בבית משפחה מקומית, עם תה ושיחה דרך המדריך.", "למי שרוצה יותר: טרק מודרך של כ־3 שעות מלאו צ׳אי לטא ואן, בירידה מתונה לרוב."]}, "Muong Hoa mountain railway Sapa": {"hist": ["רכבת ההרים מואנג הואה נפתחה ב־2019 על ידי חברת Sun World, שהקימה גם את הרכבל לפנסיפן. היא חלק מפרויקט גדול לפיתוח התיירות בסאפה, שמטרתו לחבר את מרכז העיירה ישירות לתחנת הרכבל, בלי לנסוע בכביש ההררי."], "uniq": ["הקרונות מעוצבים בסגנון רכבות אירופיות מתחילת המאה ה־20, עם עץ, פליז וחלונות גדולים, כמחווה לתקופה הצרפתית של סאפה. המסלול יורד לאורך מדרון עמק מואנג הואה, והנוף מהחלונות כולל את הטרסות ואת הכפרים שמתחת.", "בשביל מבוגרים זה פתרון נוח מאוד: התחנה במרכז העיירה, אין צורך בהליכה, והנסיעה נעימה ויציבה."], "see": ["תחנת המוצא בבניין גדול בסגנון צרפתי במרכז סאפה.", "הנוף לעמק מואנג הואה מהחלונות. כדאי לשבת בצד שפונה לעמק.", "תחנת הרכבל בסוף המסלול, שממנה ממשיכים לפנסיפן."]}, "Fansipan cable car": {"hist": ["פנסיפן, בגובה 3,143 מטר, הוא ההר הגבוה בווייטנאם, בלאוס ובקמבודיה, ולכן מכונה \"גג הודו־סין\". הצרפתים מדדו אותו לראשונה בתחילת המאה ה־20. במשך עשרות שנים הגיעו לפסגה רק מטפסים מנוסים, במסע של יומיים או שלושה דרך יער ערפל, עם לינה באוהלים בדרך.", "ב־2016 נפתח הרכבל, שבנתה חברה וייטנאמית בשיתוף מהנדסים מאוסטריה ומצרפת. הוא נכנס לספר השיאים של גינס בשני שיאים: הרכבל התלת־כבלי הארוך בעולם ללא עמודי ביניים, והפרש הגובה הגדול ביותר בין תחנת המוצא לתחנה העליונה. הפרויקט עורר גם ביקורת על הפגיעה בטבע ועל הפיכת הפסגה לאתר המוני."], "uniq": ["הנסיעה ברכבל נמשכת כרבע שעה. הקרונות עוברים מעל עמק מואנג הואה, מעל טרסות, יערות ורכסים, ולפעמים חודרים לתוך העננים ויוצאים מעליהם. בימים בהירים רואים מתחת \"ים עננים\", והנוף מרהיב.", "בתחנה העליונה ובדרך לפסגה הוקם מתחם בודהיסטי ענק: מקדשים, פגודות, פסל בודהה מברונזה בגובה של כ־21 מטר ופסל גדול של האלה קוואן אם. בפסגה עצמה עומד משולש נירוסטה שמסמן את הנקודה הגבוהה ביותר, ושם כולם מצטלמים."], "see": ["הנסיעה ברכבל. כדאי לעמוד ליד החלון בצד העמק.", "פוניקולר קצר מהתחנה העליונה כמעט עד הפסגה, במקום לטפס כ־600 מדרגות. מאוד מומלץ לגיל שלנו.", "פסל הבודהה הגדול ומקדשי המתחם.", "משולש הפסגה, 3,143 מטר.", "חשוב: בפסגה יכול להיות קר מאוד, לפעמים סביב 0 עד 5 מעלות, עם רוח. גם הגובה מורגש, אז הולכים לאט ושותים. בתחנה יש בית קפה עם שתייה חמה."]}, "Trang An Ninh Binh": {"hist": ["לפני מיליוני שנים כל האזור היה קרקעית ים. סלעי הגיר שנוצרו מהאלמוגים ומהצדפות התרוממו, והגשם והנהרות כרסמו אותם במשך אלפי שנים לצוקים, למערות ולמנהרות. כך נוצר נוף \"קארסטי\", דומה לזה של מפרץ הא לונג, רק על היבשה. לכן האזור מכונה \"הא לונג היבשתית\".", "בחפירות במערות נמצאו עדויות לכך שבני אדם חיו כאן כבר לפני כ־30,000 שנה, וראו איך הים עלה וירד. במאה ה־10 הוקמה כאן הואה לו, הבירה הראשונה של וייטנאם העצמאית אחרי אלף שנות שלטון סיני. הצוקים שימשו חומה טבעית שהגנה על הבירה. ב־2014 הוכרז מתחם טראנג אן כאתר מורשת עולמית של אונסק״ו, הראשון בווייטנאם שהוכר גם כאתר טבע וגם כאתר תרבות."], "uniq": ["השייט נעשה בסירות מתכת קטנות של 4–5 נוסעים, שחותרים בהן תושבי הכפרים, רובם נשים. הסירה עוברת בתוך מערות שהתקרה שלהן נמוכה כל כך שצריך להתכופף, ויוצאת לעמקים סגורים מוקפי צוקים, עם מקדשים קטנים על גדת המים. אין רעש של מנועים, רק משוטים, ציפורים והד במערות.", "ב־2016 צולם כאן חלק מהסרט \"קונג: אי הגולגולת\", ובאחד המסלולים נשאר כפר שבטי שנבנה כתפאורה. באזור צולמו גם סרטים וייטנאמיים רבים."], "see": ["מסלול 1: הארוך, עם הכי הרבה מערות, לאוהבי מערות.", "מסלול 2: מקדשים ותפאורת \"קונג\", מתאים למי שרוצה שילוב.", "מקדשים על גדות המים, שבהם הסירה עוצרת ואפשר לרדת לביקור קצר.", "בסביבה: הבירה העתיקה הואה לו, עם מקדשי המלכים דין ולה מהמאה ה־10, ומתחם הפגודות הענק באי דין, אחד הגדולים בדרום־מזרח אסיה.", "טיפ: לשבת באמצע הסירה, לקחת כובע ומים, ולהביא טיפ קטן לחותרת (כ־50,000 ₫)."]}, "Van Long Nature Reserve": {"hist": ["שמורת ואן לונג הוכרזה ב־2001 כדי להגן על שטח הביצות הגדול ביותר בצפון וייטנאם ועל מין קוף נדיר במיוחד: הלנגור של דלקור. הקוף נקרא על שם הזואולוג הצרפתי ז׳אן דלקור, שתיעד אותו לראשונה ב־1930. במשך שנים צדו את הקופים לשימוש ברפואה מסורתית, והם כמעט נכחדו.", "היום חיים בעולם רק כמה מאות פרטים, וואן לונג היא ביתה של האוכלוסייה הגדולה ביותר. תוכניות שמירה שבהן משתתפים תושבי הכפרים הסמוכים, שחלקם היו פעם ציידים, עזרו לייצב את המספרים."], "uniq": ["השייט כאן בסירות במבוק שטוחות, על מים צלולים ושקטים, בין צוקי גיר שמשתקפים במים כמו במראה. אין כמעט תורים ואין המון סירות, ולכן זו חוויה שקטה ומהורהרת יותר מטראנג אן ומטאם קוק.", "השמורה היא גם גן עדן לציפורים: אנפות, שלדגים ועופות מים נודדים. בבקרים מוקדמים ובשעות אחר הצהריים יש סיכוי טוב לראות את הלנגורים על הצוקים: קופים שחורים עם \"מכנסיים\" לבנים על הירכיים."], "see": ["השייט בסירת הבמבוק, כשעה עד שעה וחצי.", "מערת הואה ומערות קטנות נוספות לאורך המסלול.", "צוקי הלנגורים. כדאי להביא משקפת ולבקש מהחותר להראות היכן הם נוטים להופיע.", "כפרי הדייגים בשולי השמורה ושדות האורז שסביבם."]}, "Hang Mua Ninh Binh": {"hist": ["שם המקום פירושו \"מערת הריקוד\". לפי המסורת, במאה ה־13 מלכי שושלת טראן, שהקימו ארמון ליד הבירה העתיקה הואה לו, באו לכאן עם החצר. בתוך המערה הרקדניות של הארמון הופיעו בפניהם, ומכאן השם.", "שביל המדרגות שמוביל לפסגה הוסדר בשנים האחרונות, ובראש ההר הוצב פסל של דרקון ארוך שמתפתל על הסלעים, ולצידו פגודה קטנה. הדרקון הפך לאחד הדימויים המצולמים ביותר בנין בין."], "uniq": ["מהפסגה רואים את הנוף הטוב ביותר של נין בין: נהר נגו דונג המתפתל בין צוקי הגיר של טאם קוק, שדות אורז מסודרים כמו לוח שחמט, וכפרים קטנים. בזריחה ובשקיעה האור על הצוקים מיוחד.", "המחיר: כ־500 מדרגות אבן תלולות, בלי צל. בגיל שלנו זה דורש כושר ונעליים טובות, ועדיף ללכת בשעה קרירה. מי שלא מטפס לא מפסיד הכול: למטה יש אגם לוטוס יפה, גן ובתי קפה עם נוף לצוקים."], "see": ["המערה עצמה בתחתית ההר, קטנה ופשוטה.", "תצפית הדרקון בפסגה, עם נוף לטאם קוק.", "הפגודה בפסגה השנייה, שקטה יותר מהדרקון.", "אגם הלוטוס והגן בתחתית. הלוטוס פורח בעיקר בקיץ, אבל הגן יפה גם במרץ."]}, "Lan Ha Bay": {"hist": ["מפרץ לאן הא הוא ההמשך הדרומי־מזרחי של מפרץ הא לונג, סביב האי קאט בא, האי הגדול באזור. גיאולוגית זו אותה מערכת: מאות איים של אבן גיר שנוצרו מקרקעית ים עתיקה, נשחקו במשך מיליוני שנים, והוצפו כשמפלס הים עלה בסוף עידן הקרח.", "במערות של קאט בא נמצאו עדויות להתיישבות אנושית בת אלפי שנים. במלחמת וייטנאם שימשה אחת המערות כבית חולים סודי, ואפשר לבקר בה. ב־2004 הוכר ארכיפלג קאט בא כשמורת ביוספרה של אונסק״ו, ב־2023 הורחב אתר המורשת העולמית של הא לונג וכלל גם אותו."], "uniq": ["ההבדל העיקרי מהא לונג הוא השקט. רוב הספינות יוצאות מנמלי הא לונג ושטות באותם מסלולים, ואילו בלאן הא שטות הרבה פחות ספינות. הנוף דומה, ואפילו פראי יותר: איים מכוסי ג׳ונגל, לגונות סגורות שנכנסים אליהן רק בקייאק, וחופים קטנים של חול לבן שאין בהם איש.", "במפרץ יש כפרי דייגים צפים, שבהם משפחות חיות על רפסודות, מגדלות דגים ופנינים ומוכרות פירות ים טריים. השייט בסירת במבוק, שאחד הדייגים חותר בה, הוא דרך נעימה לראות את הכפר מקרוב."], "see": ["שייט בספינת לילה עם תאים, ארוחות על הסיפון ושקיעה בין האיים.", "קייאק או סירת במבוק בלגונות. מי שלא רוצה לחתור יכול לבחור בסירה עם חותר.", "כפר הדייגים הצף והחוות לגידול פנינים.", "חופים קטנים כמו חוף בה טראי דאו (\"שלוש האפרסקים\"), לשחייה בימים חמים.", "בבוקר על הסיפון: טאי צ׳י, תה והשמש עולה מבין האיים."]}, "Ha Long Bay": {"hist": ["שם המפרץ פירושו \"המקום שבו ירד הדרקון\". לפי האגדה, כשוייטנאם הותקפה מן הים, שלחו האלים משפחה של דרקונים להגן עליה. הדרקונים ירקו אבני ירקן ותכשיטים לים, ואלה הפכו לאיים שחסמו את ספינות האויב וריסקו אותן. אחרי הניצחון הדרקונים נשארו לחיות כאן.", "במפרץ כ־1,600 איים ואיונים, רובם בלתי מיושבים. הוא הוכרז כאתר מורשת עולמית ב־1994 בזכות היופי שלו, וב־2000 שוב בזכות החשיבות הגיאולוגית שלו. במאה ה־13 נערך כאן קרב ימי מפורסם, שבו הביס המצביא טראן הונג דאו את הצי המונגולי בעזרת יתדות עץ שתקע בקרקעית הנהר בבך דאנג הסמוך."], "uniq": ["הא לונג הוא אחד הנופים המפורסמים באסיה. צורות האיים מעוררות דמיון, ולרבים מהם יש שמות לפי הצורה: \"תרנגולים מתנשקים\", \"ראש אדם\", \"קומקום\". בתוכם מערות ענקיות עם נטיפים, שחלקן מוארות בצבעים.", "בגלל הפרסום הרב, המפרץ עמוס מאוד בספינות, בעיקר בחלק הקרוב לנמל. לכן בחרנו בשייט בלאן הא השקט יותר, שנמצא בהמשך הישיר של אותו נוף."], "see": ["מערת סונג סוט (\"מערת ההפתעה\"), אחת הגדולות במפרץ.", "האי טי טופ, עם תצפית אחרי עלייה במדרגות.", "איי \"התרנגולים המתנשקים\", סמל המפרץ.", "כפרי הדייגים הצפים."]}, "Hoi An Ancient Town": {"hist": ["כבר לפני כאלפיים שנה פעל כאן נמל של ממלכת צ׳מפה, שסחר עם הודו ועם סין. במאות ה־16 וה־17, בשם פאי פו, הפך הנמל לאחד המרכזים המסחריים החשובים בדרום־מזרח אסיה. סוחרים מיפן, מסין, מהולנד, מפורטוגל ומהודו הגיעו לכאן עם רוחות המונסון, וחיכו חודשים שהרוחות יתחלפו כדי לחזור הביתה. בזמן הזה הם הקימו כאן בתים, מחסנים ומקדשים.", "הקהילה היפנית ישבה בצד אחד של התעלה והסינית בצד השני. אחרי שיפן סגרה את עצמה לעולם ב־1639 נשארו בעיר בעיקר הסינים, והם שהשפיעו על רוב האדריכלות. במאה ה־19 נסתם הנהר בסחף, וספינות גדולות לא יכלו להגיע. הצרפתים העבירו את המסחר לדא נאנג, והוי אן נשכחה.", "הנסיגה הכלכלית היא שהצילה אותה: לא היה כסף להרוס ולבנות מחדש, והעיר \"קפאה בזמן\". גם במלחמת וייטנאם היא כמעט לא נפגעה. ב־1999 הוכרזה כאתר מורשת עולמית של אונסק״ו, בנימוק שהיא דוגמה שמורה במיוחד של נמל מסחר אסייתי."], "uniq": ["בעיר העתיקה יותר מ־1,000 מבנים היסטוריים: בתי סוחרים מעץ, בתים צהובים עם תריסים כחולים, אולמות אספה של קהילות סיניות, מקדשים ובארות. האדריכלות היא מיזוג של סגנון וייטנאמי, סיני ויפני, ובהמשך גם צרפתי.", "בערב העיר הופכת לחגיגה של אורות: מאות פנסי משי צבעוניים נדלקים מעל הרחובות ובגדות הנהר. בכל חודש, בליל הירח המלא, מכבים את התאורה החשמלית ומשאירים רק פנסים ונרות.", "הוי אן היא גם בירת החייטים של וייטנאם. יש בה מאות חנויות שתופרות חליפות, שמלות ונעליים לפי מידה תוך יום או יומיים, במחירים נמוכים."], "see": ["בית טאן קי: בית סוחרים בן יותר מ־200 שנה, שבו חיים עד היום צאצאי המשפחה. סימני גובה המים של השיטפונות חרוטים על הקיר.", "אולם האספה פוג׳יאן, המפואר מאולמות האספה של הקהילות הסיניות, מוקדש לאלת הים תיאן האו.", "מקדש משפחת טראן ובית פונג הונג.", "מוזיאון התרבות של צ׳מפה ומוזיאון קרמיקת הסחר.", "הגדה של נהר טו בון, עם סירות עץ ומסעדות.", "אוכל: קאו לאו (אטריות עבות שמכינים רק בהוי אן), באן מי (הכריך הווייטנאמי, ובאן מי פואנג המפורסם), ו\"ורד לבן\", כופתאות שרימפס עדינות."]}, "Japanese Covered Bridge Hoi An": {"hist": ["לפי המסורת, הגשר נבנה בשנות ה־90 של המאה ה־16 על ידי הקהילה היפנית, כדי לחבר את הרובע שלה לרובע הסיני שמעבר לתעלה. בשנת 1719 ביקר כאן השליט נגוין פוק צ׳ו, ונתן לגשר את שמו הרשמי, \"לאי וין קיו\", \"הגשר לאורחים מרחוק\".", "לפי אגדה מקומית, מתחת לאדמה חי מפלצת ענקית בשם נאמאזו, שראשה ביפן וזנבה בהודו, וכשהיא זזה היא גורמת לרעידות אדמה. הגשר נבנה, כך מספרים, כחרב שננעצה בגבה. במהלך השנים שופץ הגשר פעמים רבות, והוא נפתח מחדש ב־2024 אחרי שיפוץ גדול שעורר ויכוח, כי חלק מהתושבים חשבו שהוא נראה עכשיו \"חדש מדי\"."], "uniq": ["הגשר קטן, כ־18 מטר בלבד, אבל הוא סמל העיר וסמל של המפגש בין התרבויות. מבחינה אדריכלית הוא מיוחד: גשר מקורה עם גג רעפים, ובאמצעו, בצד הצפוני, מקדש קטן לאל באק דה טראן וו, שומר מזג האוויר, שהיה חשוב לחיי הספנים והדייגים.", "בכניסה מצד אחד עומדים פסלי קופים ומהצד השני פסלי כלבים. לפי אחד ההסברים, הבנייה התחילה בשנת הקוף והסתיימה בשנת הכלב. הגשר מופיע על שטר של 20,000 דונג, וכדאי לשמור שטר כזה למזכרת."], "see": ["המקדש הקטן בתוך הגשר.", "פסלי הקופים והכלבים בשני הקצוות.", "הגשר בערב, מואר בפנסים ומשתקף בתעלה.", "הבית העתיק ממש ליד הגשר בצד המערבי. עם הכרטיס אפשר להיכנס."]}, "Hoi An night market lanterns": {"hist": ["מסורת הפנסים הגיעה להוי אן עם הסוחרים הסינים והיפנים במאה ה־16. הם תלו פנסים בפתחי הבתים לברכה ולמזל, והמנהג נקלט בעיר. בשנות ה־90, כשהעיר החלה להתחדש, חידשו בעלי המלאכה את ייצור הפנסים בעבודת יד: מסגרת במבוק מכופפת, מכוסה במשי צבעוני.", "ב־1998 החלה העירייה לקיים בכל ליל ירח מלא את \"ליל העיר העתיקה\": מכבים את החשמל ברחובות, ומשאירים רק את אור הפנסים והנרות. המנהג הפך לסמל העיר ולאחד המראות המפורסמים בווייטנאם."], "uniq": ["שוק הלילה ברחוב נגוין הואנג, באי אן הוי, נפתח עם רדת החשכה. הדוכנים מלאים בפנסים בכל הצבעים והצורות, ונוצר מעין מנהרה של אור. אפשר לקנות פנסים מתקפלים שנכנסים למזוודה.", "לאורך הנהר יושבות נשים ומוכרות פנסי נייר קטנים עם נר. לפי המנהג, משיטים פנס על הנהר עם משאלה, למזל ולבריאות. אפשר לעשות זאת מהגדה, או מסירת עץ קטנה ששטה בחושך בין מאות האורות."], "see": ["דוכני הפנסים ברחוב נגוין הואנג.", "שייט סירה בנהר בשעת ערב. מסכמים על מחיר לפני שעולים.", "השטת פנס נר עם משאלה.", "דוכני אוכל רחוב: באן שאו (פנקייק קריספי), גריל של בשר על שיפודי במבוק ומשקאות מקומיים.", "צילום של הגשר היפני והנהר מהגשר החדש מעל הנהר."]}, "Tra Que vegetable village": {"hist": ["הכפר הוקם, לפי המסורת, לפני כ־300–400 שנה, על ידי משפחות שהגיעו מצפון וייטנאם והתיישבו בין נהר דה וונג ללגונה של טרא קה. הם גילו שהאצות שגדלות בלגונה הן דשן מצוין, ופיתחו שיטת גידול שעוברת מדור לדור עד היום.", "השם \"טרא קה\" בא מסוג של קינמון ריחני שגדל כאן פעם. במשך מאות שנים סיפק הכפר ירקות ועשבי תיבול לנמל המסחר של הוי אן, וגם היום רוב המסעדות בעיר קונות ממנו."], "uniq": ["החקלאים מגדלים כ־20 סוגים של עשבי תיבול וירקות: נענע, בזיליקום, כוסברה, חסה, בצל ירוק ועוד, בלי דשנים כימיים ובלי חומרי הדברה. הדשן הוא אצות מהלגונה, והקרקע החולית יחד עם המים העשירים בחומרים נותנים לעשבים ריח וטעם חזקים במיוחד. העשבים האלה הם שנותנים לקאו לאו ולמרקים של הוי אן את הטעם המיוחד שלהם.", "המראה עצמו יפה: ערוגות ירוקות מסודרות, חקלאים בכובעי קש משולשים שמשקים בשני דליים תלויים על מוט על הכתף, ותעלות מים קטנות. אין כאן תיירות המונית, והקצב איטי ושקט."], "see": ["הליכה בין הערוגות, ושיחה עם החקלאים.", "השתתפות בעבודה: חפירה, שתילה והשקיה בדליים, בבגדים מסורתיים שהחקלאים מספקים.", "סדנת בישול בכפר: מכינים פנקייק באן שאו, ספרינג רולס וסלט עם העשבים שנקטפו באותו בוקר.", "עיסוי רגליים בצמחי מרפא, מסורת מקומית לאחר יום עבודה.", "נסיעה באופניים מהעיר לכפר, דרך שדות אורז, כ־15 דקות בדרך שטוחה."]}, "Bay Mau coconut forest Cam Thanh": {"hist": ["יער הקוקוס של ביי מאו (\"שבעה מאו\", יחידת שטח ישנה) גדל במים מליחים בשפך של נהר טו בון. לפי המסורת, את דקלי קוקוס המים שתלו לפני כ־200 שנה מהגרים שהגיעו מהדרום, והדקלים התפשטו והפכו ליער של כ־100 הקטאר.", "במלחמות נגד צרפת ונגד ארצות הברית שימש היער מקום מסתור לכוחות הגרילה, כי העצים הצפופים והמים הסתירו את הלוחמים ואת הסירות שלהם. אחרי המלחמה, ובעיקר מאז שנות ה־2010, הוא הפך ליעד תיירותי פופולרי."], "uniq": ["החוויה העיקרית היא שייט בסירות הסל העגולות, \"טונג צ׳אי\". לפי הסיפור המקומי, הדייגים המציאו את הסירות העגולות בתקופה הצרפתית, כשהוטל מס על סירות: הם טענו שזו \"סלסלה\" ולא סירה. הסירות עשויות במבוק קלוע ומצופות בשרף או בזפת, והן קלות מאוד ויציבות.", "החותרים, בכובעים משולשים, מסובבים את הסירה במהירות כמו קרוסלה, שרים ומרקידים אותה למוזיקה רועשת. זה מצחיק ומאוד תיירותי. הם גם מכינים מעלי הדקל צמידים, טבעות וחגבים, ומראים איך דגים סרטנים בחכה פשוטה. מי שרוצה שייט שקט אומר לחותר מראש שלא רוצים סיבובים."], "see": ["השייט בסירת הסל בין תעלות הדקלים.", "מופע הסיבובים של החותרים. לצפות מהצד או להשתתף.", "דיג סרטנים וקבלת מתנות מעלי דקל.", "מסעדות פירות ים פשוטות על גדת הלגונה."]}, "An Bang Beach": {"hist": ["אן באנג היה כפר דייגים קטן על החוף, כמה קילומטרים צפונית להוי אן. כשהחוף הסמוך, קוואה דאי, התחיל להישחק מגלים וסערות, עברו רבים מהמטיילים לאן באנג, ובשנות ה־2010 צמחו כאן מסעדות, בתי קפה ובתי הארחה קטנים.", "בדומה לחופים אחרים במרכז וייטנאם, גם אן באנג סובל משחיקה, ובשנים האחרונות הוצבו לאורכו שקי חול ושוברי גלים במקומות מסוימים."], "uniq": ["החוף רחב ורך, עם חול בהיר ומים כחולים, ומאחוריו רצועה של מסעדות פירות ים ובתי קפה עם כיסאות נוח ומטריות קש. האווירה רגועה ונינוחה, הרבה פחות מתוירת מחופי דא נאנג.", "בבוקר מוקדם רואים כאן את הדייגים חוזרים מהים בסירות סל, וממיינים את השלל על החול. זו תמונה יפה ואמיתית של החיים במרכז וייטנאם. במרץ המים עדיין קרירים לרחצה ממושכת, אבל מזג האוויר נעים מאוד לישיבה ולטיול."], "see": ["הזריחה על החוף, עם סירות הדייגים.", "ארוחת צהריים של פירות ים טריים במסעדה על החול: שרימפס, קלמרי, דגים בגריל.", "הליכה לאורך החוף לכיוון קוואה דאי.", "שקיעה עם קפה קוקוס."]}, "My Son Sanctuary": {"hist": ["ממלכת צ׳מפה שלטה במרכז ובדרום וייטנאם של היום מהמאה ה־2 ועד המאה ה־17. אנשיה היו יורדי ים וסוחרים, והם קיבלו את דתם ותרבותם מהודו, ובעיקר את הפולחן לאל שיווה. מי סון היה המרכז הדתי של הממלכה ומקום הקבורה של מלכיה.", "במשך כאלף שנה, מהמאה ה־4 ועד המאה ה־13, בנו המלכים בעמק המוקף הרים יותר מ־70 מקדשים. המקדש הראשון היה מעץ ונשרף, והחליפו אותו מקדשי לבנים. עם שקיעת צ׳מפה ננטש המקום, היער כיסה אותו, והוא התגלה מחדש ב־1898 על ידי חוקרים צרפתים.", "ב־1969, במלחמת וייטנאם, הסתתרו כוחות הווייטקונג באזור, ומטוסים אמריקאיים הפציצו אותו. רוב המקדשים נהרסו, ונשארו בשטח מכתשי פצצות שאפשר לראות עד היום. ב־1999 הוכרז מי סון כאתר מורשת עולמית."], "uniq": ["המקדשים בנויים מלבנים אדומות, בלי טיח נראה לעין בין הלבנים, וחוקרים עדיין מתווכחים איך הלבנים מחוברות זו לזו כל כך חזק. יש השערות על שרף צמחי או על \"שריפה\" של המבנה כולו אחרי הבנייה. על הקירות חיטובים עדינים של אלים, רקדניות, אריות ודמויות מהמיתולוגיה ההודית.", "האתר שקט ומסתורי, בעמק ירוק עם נחל, ומשווים אותו לפעמים לאנגקור וואט בקמבודיה, אם כי הוא קטן ממנו בהרבה. כדאי להגיע מוקדם בבוקר, לפני החום וההמונים."], "see": ["קבוצות המקדשים B, C ו־D, השמורות והמשוחזרות ביותר.", "מוזיאון קטן בכניסה, עם הסבר על צ׳מפה ועל השיחזור.", "מופע ריקוד צ׳אמי מסורתי, כמה פעמים ביום.", "מכתשי הפצצות בין המקדשים.", "שימו לב: יש הליכה של כמה קילומטרים בשטח, חלקה בשמש. יש רכב חשמלי מהכניסה עד תחילת האתר."]}, "Hai Van Pass": {"hist": ["רכס טרונג סון, שמשתרע לאורך כל וייטנאם, מגיע כאן עד הים ויוצר מחסום טבעי בין הצפון לדרום. במשך מאות שנים היה המעבר גבול בין הממלכה הווייטנאמית לממלכת צ׳מפה, ואחר כך בין מחוזות. בפסגה נבנה במאה ה־19 שער מבוצר בשם \"הואה ואן קוואן\" (\"השער לצפון הענן והים\"), ששרידיו עומדים עד היום.", "בתקופה הצרפתית ובמלחמת וייטנאם השתמשו בפסגה כעמדת תצפית צבאית, ונשארו בה בונקרים מבטון. ב־2005 נפתחה מנהרה ארוכה מתחת להר, ומאז רוב המשאיות והאוטובוסים נוסעים בה, והכביש הישן על ההר נשאר שקט ויפה לנסיעה איטית."], "uniq": ["השם פירושו \"מעבר הענן והים\", כי הפסגה, בגובה של כ־500 מטר, לעיתים קרובות עטופה בעננים בזמן שהים נוצץ מתחת. המעבר הוא גם גבול אקלימי: מצפון לו קריר וגשום יותר, ומדרום לו חם ויבש יותר.", "הכביש מתפתל לאורך כ־20 ק״מ בין יער טרופי לצוקים מעל הים, ובכל סיבוב נפתח נוף אחר: מפרץ דא נאנג והעיר מצד אחד, לגונת לאנג קו והחופים מהצד השני. ב־2008 הפך המעבר למפורסם בעולם, אחרי שהתוכנית הבריטית \"טופ גיר\" נסעה בו והציגה אותו כאחד הכבישים היפים בעולם."], "see": ["הפסגה: השער העתיק, הבונקרים ותצפית לשני הצדדים.", "תצפיות לאורך הדרך על מפרץ דא נאנג.", "הירידה לכיוון לאנג קו, עם נוף ללגונה ולכפר.", "אם עוצרים בדא נאנג: גשר הדרקון וחוף מי קה."]}, "Lang Co Bay": {"hist": ["לאנג קו הוא כפר דייגים ותיק על לשון חול צרה, בין הים הפתוח מצד אחד ללגונה שקטה, לאפ אן, מהצד השני. במשך דורות התפרנסו התושבים מדיג ומגידול צדפות ושרימפס בלגונה. הכביש הראשי בין הצפון לדרום עובר בדיוק דרך הכפר, ולכן הוא היה תמיד תחנת עצירה למטיילים.", "המפרץ של לאנג קו הוכר ב־2009 כחבר בארגון \"המפרצים היפים בעולם\", לצד מפרץ הא לונג ומפרצים מפורסמים אחרים."], "uniq": ["הנוף משני צידי הכביש הוא מה שמייחד את לאנג קו: מצד אחד חוף ים ארוך עם חול לבן, ומהצד השני לגונה רגועה עם הרים ירוקים שמשתקפים בה ועמודי עץ של חוות צדפות. בשעות הבוקר והערב האור על הלגונה רך ויפה במיוחד.", "הלגונה מפורסמת בצדפות שלה, ולאורכה מסעדות פירות ים פשוטות על כלונסאות מעל המים, שבהן אוכלים מה שנדוג באותו יום."], "see": ["מסעדות פירות ים על הלגונה: צדפות בגריל עם בצל ירוק ובוטנים, סרטנים, שרימפס.", "תצפית על הלגונה מהגשר או מהכביש.", "החוף הארוך בצד הים.", "חוות הצדפות והדייגים בסירות קטנות."]}, "Imperial City Hue": {"hist": ["ב־1802 איחד הקיסר גיה לונג את וייטנאם תחת שושלת נגוין, והקים את הבירה בהואה, על גדות נהר הבושם. במשך כ־30 שנה נבנתה מצודה ענקית, בהשראת העיר האסורה בבייג׳ינג ובשילוב עקרונות של ביצורים צרפתיים: חומה של כ־10 ק״מ, תעלות מים, מגדלים ושערים.", "שושלת נגוין שלטה כ־143 שנה, ב־13 קיסרים. מאמצע המאה ה־19 השתלטו הצרפתים על המדינה, והקיסרים הפכו בהדרגה לסמליים. הקיסר האחרון, באו דאי, ויתר על הכס ב־1945, ובכך הסתיימה אלפיים שנות מונרכיה בווייטנאם.", "במתקפת טט ב־1968 התנהל בהואה אחד הקרבות הקשים במלחמה, כמעט חודש של לחימה מבית לבית. רוב המבנים בעיר האסורה נהרסו. ב־1993 הוכרז מתחם המונומנטים של הואה כאתר מורשת עולמית, ומאז השיחזור נמשך, מבנה אחרי מבנה."], "uniq": ["המצודה בנויה בשלוש טבעות, אחת בתוך השנייה: העיר המבוצרת, ובתוכה העיר הקיסרית עם הארמונות ואולמות הטקסים, ובליבה העיר האסורה הסגולה, שבה חיו הקיסר, נשותיו ומשרתיו. רק סריסים הורשו להיכנס אליה מלבד בני המשפחה.", "כל המתחם תוכנן לפי עקרונות פנג שואי: נהר הבושם מלפנים, הר נגו בין כמגן מול השער, ושני איים בנהר כ\"דרקון\" ו\"נמר\" ששומרים על העיר. גם היום, בין ההריסות והמבנים המשוחזרים, מרגישים את הגודל ואת הטקסיות של החצר הקיסרית."], "see": ["שער נגו מון (\"שער הצהריים\"), הכניסה הראשית, עם ביתן חמש הפניקסים מעליו, שבו הקיסר הופיע בפני העם.", "ארמון טאי הואה (\"ארמון ההרמוניה העליונה\"), אולם הכתרים, עם 80 עמודי עץ מצופים לכה וזהב.", "מקדש טה מיו ושבעת הדודים (כדי ברונזה ענקיים), כל אחד מוקדש לקיסר אחר.", "מסדרונות הגן ותיאטרון החצר, שבו מוצגים לפעמים מופעי מוזיקת חצר מסורתית (נה נהק, מורשת אונסק״ו).", "מגדל הדגל מעל החומה, מהמבנים הבולטים בעיר."]}, "Thien Mu Pagoda": {"hist": ["לפי המסורת, ב־1601 עבר כאן נגוין הואנג, מושל האזור, ושמע מהתושבים אגדה על אישה זקנה שהופיעה על הגבעה וניבאה שאדם יבוא ויבנה כאן פגודה שתביא שגשוג לארץ. הוא בנה את הפגודה וקרא לה \"פגודת הגברת השמימית\". בהמשך שושלתו, אדוני נגוין, אכן איחדה את המדינה.", "המגדל המתומן בן שבע הקומות, פואוק זויין, נבנה ב־1844 בהוראת הקיסר טיאו טרי, וגובהו כ־21 מטר. כל קומה מוקדשת לבודהה שהופיע בעולם בצורת אדם.", "ב־1963 נסע נזיר מהמנזר, טיך קוואנג דוק, לסייגון, והצית את עצמו ברחוב במחאה על רדיפת הבודהיסטים בידי משטר נגו דין דיאם. התמונה שלו מתוך הלהבות הסתובבה בעולם והשפיעה על דעת הקהל. המכונית שבה נסע מוצגת עד היום בחצר המנזר."], "uniq": ["הפגודה עומדת על גבעה מעל עיקול של נהר הבושם, והמגדל שלה הוא סמל העיר הואה. הוא מופיע בשירים, בציורים ובשירה הווייטנאמית. המקום עדיין מנזר פעיל, ורואים בו נזירים צעירים בגלימות אפורות לומדים, מטאטאים את החצר ומטפלים בגן.", "ההגעה בסירת דרקון צבעונית במעלה הנהר היא חלק מהחוויה. הסירות רחבות, איטיות ויציבות, ועוגנות ממש למרגלות המדרגות שמובילות לפגודה."], "see": ["המגדל המתומן ופעמון הברונזה הגדול מ־1710, שמשקלו מעל שני טונות.", "צב שיש ענק שנושא על גבו מצבה מ־1715.", "אולם הפולחן, עם פסלי בודהה ופסלי שומרים.", "המכונית הכחולה של הנזיר טיך קוואנג דוק.", "גן הבונסאי והגנים מאחורי המנזר, עם נוף לנהר."]}, "Tomb of Tu Duc": {"hist": ["טו דוק היה הקיסר הרביעי של שושלת נגוין, והשליט לזמן הארוך ביותר בשושלת: 35 שנה, מ־1848 עד 1883. בתקופתו השתלטו הצרפתים על דרום וייטנאם ועל חלקים נוספים, והוא נחשב לשליט אינטלקטואל ומשורר שלא הצליח לעמוד מולם.", "את הקבר בנו בשנים 1864–1867 כ־3,000 פועלים וחיילים, בתנאים קשים כל כך שפרץ מרד בקרב הבונים. הקיסר השתמש במקום עוד בחייו כמקום מפלט: היה מגיע לכתוב שירה, לדוג באגם, לצוד ולשוחח עם נשותיו (היו לו יותר ממאה). למרות זאת לא נולדו לו ילדים, אולי בעקבות מחלת אבעבועות בילדותו."], "uniq": ["בניגוד לקברים הרשמיים והסימטריים של קיסרים אחרים, הקבר של טו דוק הוא גן רומנטי ופיוטי: אגם לוטוס, ביתנים מעל המים, גשרים, שבילים בין עצי אורן ופרנגיפני, ואולמות שבהם חי. האווירה שקטה ומהורהרת, ולטעם של רבים זה הקבר היפה מבין קברי הקיסרים בהואה.", "המצבה הגדולה, שוקלת כ־20 טון, נושאת טקסט שכתב הקיסר עצמו: כ־4,900 תווים, שבהם הוא מספר את חייו ומודה בטעויותיו. והסוד: הקיסר כלל לא נקבר כאן. גופתו נקברה במקום אחר, שנשמר בסוד, ולפי האגדה כל 200 המשרתים שקברו אותו הוצאו להורג כדי שהסוד לא יתגלה. מקום הקבורה לא נמצא עד היום."], "see": ["אגם לואו קיאם וביתן שונג קיאם על המים, שבו הקיסר ישב לכתוב שירה.", "מקדש הואה קיאם, שבו עבדו את הקיסר ואת אשתו אחרי מותם.", "תיאטרון המלוכה מינה קיאם, אחד העתיקים בווייטנאם.", "חצר המכובדים: פסלי אבן של מנדרינים, פילים וסוסים.", "מגדל המצבה והקבר הסמלי."]}, "Saigon Central Post Office": {"hist": ["בניין הדואר נבנה בשנים 1886–1891, כשסייגון הייתה בירת \"קושינשינה\", המושבה הצרפתית בדרום וייטנאם. הצרפתים רצו להראות את עוצמתם ואת הקידמה שהביאו, ובנו מבנים ציבוריים מפוארים בסגנון אירופי. את הבניין תכנן האדריכל הצרפתי אלפרד פולו, והוא מיוחס לעיתים, ללא ביסוס ברור, לגוסטב אייפל.", "במשך יותר ממאה שנה הוא שימש כדואר הראשי של העיר, והוא ממשיך לפעול גם היום."], "uniq": ["הבניין משלב אדריכלות צרפתית בסגנון גותי ורנסנסי עם מבנה ברזל וזכוכית מודרני לתקופתו, שמזכיר תחנות רכבת אירופיות. התקרה המקושתת והגבוהה, עם עמודי ברזל ירוקים, יוצרת אולם מרווח ומואר.", "על הקירות שתי מפות היסטוריות מצוירות ביד: מפה של סייגון וסביבותיה מ־1892, ומפה של קווי הטלגרף בדרום וייטנאם ובקמבודיה מ־1936. בקצה האולם תלויה תמונה ענקית של הו צ׳י מין. עד לפני שנים מעטות ישב כאן אחד הכותבים הציבוריים האחרונים, שכתב ותרגם מכתבים עבור אנשים."], "see": ["האולם המרכזי והתקרה המקושתת.", "המפות ההיסטוריות על הקירות.", "תאי הטלפון הישנים מעץ, שמשמשים היום כעמדות כספומט וחנות.", "שליחת גלויה הביתה, עם בול וייטנאמי.", "רחוב הספרים שליד, נגוין ואן בין, עם חנויות ספרים ובתי קפה בצל העצים."]}, "Notre-Dame Cathedral Basilica of Saigon": {"hist": ["הקתדרלה נבנתה בשנים 1863–1880, בתקופה הצרפתית, כדי לשרת את המתיישבים הצרפתים ואת הקהילה הקתולית המקומית. את כל חומרי הבנייה הביאו מצרפת, כולל הלבנים האדומות ממרסיי, שלא טויחו כדי להבליט את צבען, ואריחי הגג. החלונות הצבעוניים הגיעו מבית מלאכה בשארטר.", "ב־1895 נוספו שני מגדלי הפעמונים, בגובה של כ־58 מטר, עם שישה פעמונים. ב־1959 הוצב בכיכר פסל של מריה, \"גברת השלום\", מגרניט רומאי. ב־1962 הכריז האפיפיור על הכנסייה כבזיליקה."], "uniq": ["הקתדרלה היא דוגמה בולטת לאדריכלות הצרפתית־קולוניאלית בדרום־מזרח אסיה, בסגנון רומנסקי משולב בגותי. הלבנים האדומות, שאחרי כ־150 שנה עדיין שומרות על צבען, הן הסימן המזהה שלה.", "מאז 2017 היא נמצאת בתהליך שיפוץ ושימור גדול, שנמשך שנים רבות. הכנסייה פתוחה בעיקר לתפילות, והפיגומים מסתירים חלק מהחזית, אבל הכיכר שלפניה והבניין עצמו עדיין מרשימים."], "see": ["החזית והמגדלים מהכיכר.", "פסל מריה \"גברת השלום\" במרכז הכיכר.", "הדואר המרכזי ממש מעבר לכביש.", "בתי הקפה ברחוב שליד, עם נוף לקתדרלה."]}, "War Remnants Museum": {"hist": ["המוזיאון נפתח בספטמבר 1975, חודשים ספורים אחרי נפילת סייגון וסוף המלחמה. בתחילה נקרא \"בית התערוכה לפשעי האמריקאים ובובותיהם\", ובהמשך שונה שמו לשם הנוכחי, כשהיחסים עם ארצות הברית החלו להשתפר בשנות ה־90.", "המוזיאון מציג את מלחמת וייטנאם, שהווייטנאמים מכנים \"המלחמה האמריקאית\", ואת המלחמה הקודמת נגד צרפת, מנקודת המבט הווייטנאמית. זה אחד המוזיאונים המבוקרים ביותר במדינה."], "uniq": ["זה מוזיאון קשה ומטלטל. התערוכות מציגות תצלומים של מעשי טבח, של פצועים ושל הרס, וחפצים ממחנות שבויים. האולם המכביד ביותר עוסק ב\"סוכן הכתום\", חומר הדברה רעיל שפוזר מהאוויר על יערות וייטנאם, ובהשפעתו על דורות של ילדים שנולדו עם מומים.", "אחד האולמות המרשימים מציג עבודות של צלמי מלחמה מכל העולם, רבים מהם נהרגו בזמן העבודה. לצד הצילומים יש גם תיעוד של תנועת המחאה העולמית נגד המלחמה. חשוב לדעת שהמוזיאון מציג צד אחד של הסיפור, ובכל זאת הוא חיוני להבנת וייטנאם של היום."], "see": ["החצר: מטוסים, מסוקים, טנקים ופצצות אמריקאיים.", "שחזור של \"כלובי הנמר\" מבית הכלא באי קון סון.", "אולם צלמי המלחמה, \"רקוויאם\".", "אולם הסוכן הכתום. מי שרגיש יכול לדלג עליו.", "כדאי להקדיש כשעתיים, ולתכנן אחריו משהו רגוע."]}, "Ben Thanh Market": {"hist": ["שוק בשם בן טאן פעל כבר לפני הגעת הצרפתים, ליד נהר סייגון, והשם פירושו \"רציף המבצר\". הצרפתים העבירו את השוק למקומו הנוכחי והקימו את הבניין בשנים 1912–1914.", "מגדל השעון בכניסה הדרומית הפך לסמל העיר. במהלך המלחמה ואחריה המשיך השוק לפעול, והוא עבר שיפוצים רבים, אבל המבנה הבסיסי נשמר."], "uniq": ["בשוק מאות רבות של דוכנים, מחולקים לפי סוגים: בדים ובגדים, נעליים ותיקים, קפה ותבלינים, מזכרות ועבודות לכה, פירות טרופיים, ואזור אוכל במרכז. זה מקום של רעש, צבעים וריחות, ומהיר מאוד בקצב.", "השוק מכוון היום בעיקר לתיירים, והמחירים מנופחים. אם קונים, מתמקחים בנימוס ובחיוך, ומתחילים מכחצי מהמחיר שנאמר. אזור האוכל, לעומת זאת, הוא מקום טוב לטעום מנות דרום וייטנאמיות במחיר סביר."], "see": ["מגדל השעון בכניסה הדרומית.", "דוכני הקפה: פולי רובוסטה וייטנאמיים ופילטר פין לחליטה בבית.", "אזור האוכל: באן שאו, פו, בון טיט נואנג (אטריות עם בשר בגריל), ומשקאות קני סוכר.", "פירות טרופיים: דרקון, מנגוסטין, רמבוטן ודוריאן למי שמעז.", "בערב: שוק לילה ברחובות שמסביב."]}, "Ben Tre Mekong Delta": {"hist": ["נהר המקונג יוצא מרמת טיבט, עובר בסין, מיאנמר, לאוס, תאילנד וקמבודיה, ובדרום וייטנאם מתפצל לזרועות רבות לפני שהוא נשפך לים. הדלתא שלו היא אחד האזורים הפוריים בעולם, ומכונה \"סל האורז של וייטנאם\". מחוז בן טרה בנוי מכמה איים גדולים בין ארבע זרועות של הנהר.", "בן טרה ידועה בהיסטוריה של התנגדות. ב־1960 פרץ כאן \"המרד הכללי\" (דונג קוי) נגד משטר הדרום, שנחשב לאחת מנקודות הפתיחה של המלחמה. הגיבורה המקומית, נגוין טי דין, הייתה מראשי המרד, ומאוחר יותר הפכה לאישה הראשונה בדרגת גנרל בצבא וייטנאם."], "uniq": ["בן טרה היא \"בירת הקוקוס\" של וייטנאם: דקלי קוקוס מכסים את רוב השטח, ומהם מייצרים סוכריות, שמן, פחם, מחצלות, כלי מטבח ועוד. התעלות הצרות בין המטעים, שעליהן נוטים עלי הדקלים כמו מנהרה ירוקה, הן המראה המייצג של המקום.", "בהשוואה למי טו, היעד הקלאסי בטיולי יום מסייגון, בן טרה שקטה, ירוקה וכפרית יותר. החיים מתנהלים בקצב של הנהר: סירות עמוסות פירות, ילדים שקופצים למים, ובתים עם מזח עץ קטן."], "see": ["שייט בסירה קטנה בתעלות הקוקוס, עם חותרת בכובע משולש.", "בית מלאכה לסוכריות קוקוס: רואים את כל התהליך וטועמים חמות.", "ייצור נייר אורז ואטריות אורז בעבודת יד.", "טעימת פירות טרופיים ותה דבש, עם מוזיקה דרום־וייטנאמית מסורתית (דון קה טאי טו).", "נסיעה קצרה בעגלת סוס או באופניים בין הכפרים."]}, "Cafe Giang Hanoi egg coffee": {"hist": ["ב־1946, בזמן מלחמת העצמאות נגד צרפת, היה בהאנוי מחסור חמור בחלב. נגוין ואן ג׳יאנג, ברמן במלון מטרופול, המלון היוקרתי של העיר, חיפש תחליף לחלב ולקצפת בקפה. הוא הקציף חלמוני ביצה עם סוכר עד שקיבל קרם בהיר ואוורירי, ושפך אותו על קפה וייטנאמי חזק.", "ההמצאה הצליחה. ב־1946 פתח ג׳יאנג בית קפה משלו, והמשפחה מנהלת אותו עד היום, היום ברחוב נגוין הוו הואן, ליד אגם הואן קיאם. המתכון נשמר במשפחה, והבן והנכדים ממשיכים להכין אותו באותה שיטה."], "uniq": ["קפה ביצה (קא פה טרונג) הוא משקה שנולד בהאנוי ולא קיים כמעט בשום מקום אחר. הוא מגיע בכוס קטנה, לעיתים בתוך קערת מים חמים כדי לשמור על החום: למטה שכבה של קפה חזק ומר, ולמעלה קרם סמיך, מתוק ומוקצף שדומה לטעם טירמיסו או קרם ברולה. לא מרגישים טעם של ביצה.", "בית הקפה עצמו הוא חוויה: נכנסים דרך מעבר צר בין חנויות, ומגיעים לחדר פשוט עם שרפרפים נמוכים, תמונות ישנות ואווירה של פעם."], "see": ["קפה ביצה חם, המנה הקלאסית.", "קפה ביצה קר, טוב לימים חמים.", "קקאו ביצה, למי שלא שותה קפה.", "בסביבה: עוד בתי קפה עם קפה ביצה, כמו דין, בקומה עליונה מעל האגם."]}, "Hang Gai street Hanoi": {"hist": ["האנג גאי פירושו \"רחוב הקנבוס\". ברחוב הזה, אחד מ־36 רחובות הגילדות של הרובע העתיק, מכרו פעם חבלים, שקים ורשתות מסיבי קנבוס. בתחילת המאה ה־20 התחלפה הסחורה במשי ובבדים, ובהמשך במוצרי רקמה ומזכרות.", "בתקופה הצרפתית היה הרחוב אחד הרחובות המסחריים העשירים בהאנוי, וחלק מהבתים עדיין שומרים על חזיתות מאותה תקופה."], "uniq": ["היום זה רחוב המשי של האנוי: חנויות בדי משי לפי מטר, צעיפים, עניבות, ארנקים, תמונות רקמה בעבודת יד, ובגדים מסורתיים (אאו זאי). ברוב החנויות יש גם חייטים שתופרים בגד לפי מידה תוך יום או יומיים.", "איכות המשי משתנה מאוד, וחלק מה\"משי\" הוא בעצם סינתטי. משי אמיתי מרגיש קריר ורך, ומחירו גבוה יותר. כדאי לקנות בחנויות מוכרות, כמו חנויות בעלות מחיר קבוע, ולהשוות בין כמה חנויות לפני הקנייה."], "see": ["חנויות המשי והחייטים לאורך הרחוב.", "תמונות רקמה ידנית: נופים, פרחים וסצנות כפר.", "אאו זאי, השמלה המסורתית הווייטנאמית, בהזמנה לפי מידה.", "רחובות הגילדות הסמוכים: האנג באק (תכשיטי כסף) והאנג קוואט (חפצי פולחן ודגלים)."]}, "Long Bien Bridge": {"hist": ["גשר לונג ביין נבנה בשנים 1899–1902 בידי חברה צרפתית, ונקרא אז \"גשר פול דומר\" על שם המושל הכללי של הודו־סין. אורכו כ־1.7 ק״מ (עם המעברים מעל היבשה כ־2.3 ק״מ), ובזמנו היה מהגשרים הארוכים באסיה. הוא היה החוליה המרכזית בקו הרכבת מהאנוי לנמל הייפונג.", "במלחמת וייטנאם היה הגשר היעד של הפצצות אמריקאיות רבות, כי דרכו עברו אספקה ונשק. הוא נפגע שוב ושוב, ושוב ושוב תוקן בידי אנשי העיר, ולכן הפך לסמל לעמידות של האנוי. גם היום רואים בו חלקים בצורות שונות: המקוריים והמתוקנים."], "uniq": ["הגשר עדיין פעיל, אבל רק לרכבות, אופנועים, אופניים והולכי רגל. מכוניות נוסעות בגשרים חדשים יותר. ההליכה עליו בבוקר מוקדם מעניקה תמונה מיוחדת של העיר: הנהר האדום הרחב, ערפל, שדות ירקות על אי בנהר, ואנשים שעובדים בהם.", "מתחת לגשר, בצד העיר, פועל לפני הזריחה שוק סיטונאי של פירות וירקות, שממנו יוצאות המוכרות עם סלים על אופניים לכל רחובות העיר."], "see": ["הליכה על המעבר להולכי רגל בצד הגשר, עד הנהר.", "רכבת שעוברת על הגשר. רועש, ומרשים.", "שוק הסיטונאים מתחת לגשר, לפני 6:00 בבוקר.", "האי באמצע הנהר, עם גינות הירק."]}, "Truc Bach Lake": {"hist": ["אגם טרוק באך הוא חלק שנותק מהאגם המערבי, האגם הגדול של האנוי, בעזרת סוללה שנבנתה במאה ה־17. בתקופת אדוני טרין הוקם על גדתו ארמון קיץ, שבהמשך הפך למקום שבו נכלאו נשות חצר שנענשו. הן ארגו שם משי משובח בשם \"טרוק באך\", ועל שמו נקרא האגם.", "ב־1967, במלחמת וייטנאם, הופל מעל האנוי מטוסו של טייס אמריקאי צעיר, ג׳ון מקיין, והוא נחת באגם. מקיין הפך לימים לסנאטור ולמועמד לנשיאות ארצות הברית, ועל הגדה עומדת אבן זיכרון קטנה לאירוע."], "uniq": ["האגם קטן, שקט ומוקף עצים, ובניגוד לאגם הואן קיאם, כמעט אין בו תיירים. סביבו מסעדות מקומיות, בתי קפה עם כיסאות קטנים על המדרכה, ומשפחות שבאות לשבת בערב.", "כאן הומצא ה\"פו קואון\", גליל מקמח אורז במילוי בשר וירקות, ולכן ברחוב נגו שה, על הגדה, יש שורה של מסעדות שמגישות אותו."], "see": ["הליכה רגועה סביב האגם.", "פו קואון ופו צ׳ין (פו מטוגן) במסעדות ברחוב נגו שה.", "אבן הזיכרון לג׳ון מקיין.", "פגודת טראן קווק, הפגודה העתיקה בהאנוי, על אי באגם המערבי הסמוך."]}, "Thanh Ha pottery village": {"hist": ["כפר הקדרים טאן הא הוקם, לפי המסורת, בסוף המאה ה־15 בידי משפחות קדרים שהגיעו מצפון וייטנאם. כשהוי אן הייתה נמל מסחר גדול, הכפר סיפק לה כלי חרס, רעפים ולבנים, ורבים מהרעפים על גגות העיר העתיקה יוצרו כאן.", "עם שקיעת הנמל ועם כניסת כלים תעשייתיים, הכפר כמעט נעלם. בעשורים האחרונים התחדש, בעיקר בזכות התיירות, והיום עובדות בו כמה עשרות משפחות במלאכה המסורתית."], "uniq": ["בטאן הא עדיין עובדים בשיטות של לפני מאות שנים: אדמת חרסית מנהר טו בון, אובניים שמסובבים ברגל או ביד, ייבוש בשמש ושריפה בתנור עצים. הקדרים הוותיקים יוצרים כלי מושלם בתוך דקות, בלי כל מכשיר מדידה.", "בכפר יש גם פארק טרקוטה, שבו מוצגים דגמים מוקטנים של מבנים מפורסמים מכל העולם, כולם מחרס. אפשר לנסות בעצמכם לעבוד על האובניים, ולקבל את הכלי שיצרתם."], "see": ["בתי המלאכה של הקדרים, עם הדגמה.", "ניסיון אישי על האובניים.", "פארק הטרקוטה והמוזיאון.", "משרוקיות חרס בצורת חיות, המזכרת הקלאסית של הכפר."]}, "Thanh Toan bridge Hue": {"hist": ["גשר העץ המקורה טאן טואן נבנה ב־1776 על ידי אישה בשם טראן טי דאו, אשתו של פקיד בכיר בחצר. היא תרמה את הכסף כדי שאנשי הכפר יוכלו לחצות את התעלה בקלות. כשהקיסר לה הין טונג שמע על כך, הוא פטר את הכפר ממיסים כאות תודה.", "במהלך השנים הגשר שופץ כמה פעמים, ובתוכו נבנה מזבח לזכר האישה הנדיבה. גם היום מביאים לו התושבים מנחות."], "uniq": ["זה אחד מגשרי העץ המקורים הבודדים שנשארו בווייטנאם, ובניגוד לגשר היפני בהוי אן, הוא שקט לגמרי. הגשר עומד בין שדות אורז ירוקים, ואנשי הכפר יושבים בו לנוח בצל, משוחחים ומשחקים קלפים.", "הכפר טאן טואן עצמו שמור ויפה: בתים ישנים, בית קהילה, ושבילים בין השדות. זה מקום מצוין לראות את חיי הכפר של מרכז וייטנאם."], "see": ["הגשר והמזבח שבתוכו.", "מוזיאון קטן לכלי חקלאות מסורתיים ליד הגשר.", "שבילי השדות סביב הכפר.", "בית הקהילה של הכפר."]}, "Thuy Bieu village Hue": {"hist": ["טוי ביאו הוא כפר עתיק על גדת נהר הבושם, בין המצודה לקברי הקיסרים. במשך דורות התגוררו בו פקידים ובני משפחות של החצר הקיסרית, שבנו בו \"בתי גן\": בתי עץ מסורתיים בתוך חצרות גדולות עם מטעים, בריכות ומזבחות.", "הכפר מפורסם במיוחד בפומלו (פרי הדר הגדול) \"טאן טרא\", שבעבר נשלח לקיסר כמתנה. בשנים האחרונות התחיל הכפר לקבל מבקרים בתיירות קהילתית."], "uniq": ["בתי הגן של הואה הם סגנון מגורים ייחודי לעיר: בית עץ מגולף עם עמודים, מוקף בגן מתוכנן לפי פנג שואי, עם קיר מגן לפני הכניסה, בריכת דגים ועצי פרי. בחלק מהבתים חיות עדיין המשפחות, והן מקבלות אורחים לתה ולארוחה ביתית."], "see": ["ביקור בבית גן מסורתי וטעימת פומלו.", "ארוחה ביתית אצל משפחה.", "אופניים בשבילי הכפר, בין המטעים."]}, "Tam Giang lagoon": {"hist": ["מערכת הלגונות טאם זאנג – קאו האי משתרעת לאורך כ־70 ק״מ צפונית ומזרחית להואה, והיא הלגונה הגדולה בדרום־מזרח אסיה. אלפי שנים חיים לאורכה דייגים, בכפרים שבנויים על חוף הלגונה ועל לשונות החול שמפרידות בינה לבין הים.", "במשך דורות פיתחו התושבים שיטות דיג מיוחדות: מלכודות של מוטות במבוק ורשתות, שיוצרות על פני המים \"מבוך\" שבו נלכדים הדגים. הקרקע הענייה והסערות הקשות הפכו את החיים כאן לקשים במיוחד."], "uniq": ["בשקיעה, כשהשמש יורדת מעבר להרים מעל המים, הלגונה נצבעת בכתום ובסגול, ועמודי הבמבוק של המלכודות יוצרים צלליות. רבים מחשיבים זאת לאחת השקיעות היפות בווייטנאם.", "אין כאן כמעט תשתית תיירותית, וזה בדיוק היתרון: רואים חיים אמיתיים של דייגים, בתים על כלונסאות, ונשים שמנקות רשתות."], "see": ["שייט בסירה עם דייג מקומי בשקיעה.", "כפר הדייגים צ׳ואן, ושוק הדגים בבוקר.", "מסעדת פירות ים על כלונסאות מעל הלגונה.", "צילום של מלכודות הבמבוק."]}, "Ta Phin village Sapa": {"hist": ["טא פין הוא כפר בעמק שקט צפון־מזרחית לסאפה, שבו חיים בעיקר בני הדאו האדומים ומעט המונג. בני הדאו הגיעו לאזור לפני כמה מאות שנים מדרום סין. יש להם כתב משלהם, המבוסס על תווים סיניים, וספרי טקסים שעוברים מדור לדור.", "בתקופה הצרפתית הוקם בכפר מנזר, ששרידיו, קירות אבן מכוסים צמחייה, עומדים עד היום. בשנים האחרונות הפך הכפר ליעד שקט יותר למי שרוצה להכיר את בני הדאו."], "uniq": ["נשות הדאו האדומים מזוהות במיד: מטפחות ראש אדומות גדולות, בגדים רקומים בשפע, ולעיתים גם גבות מגולחות, מנהג מסורתי של נשים נשואות. הרקמה שלהן מפורטת ועשירה, ובכפר אפשר לקנות ישירות מהנשים שרקמו.", "הדאו האדומים מפורסמים ברפואה הצמחית שלהם. \"האמבט הצמחי של הדאו\" עשוי מעשרות צמחי מרפא שנקטפים ביער ומבושלים בחבית עץ. האמבט החם מרגיע את הגוף ונחשב מועיל לשרירים ולמפרקים, טיפול מצוין אחרי יום של הליכה."], "see": ["אמבט צמחי מרפא בבית משפחה.", "שרידי המנזר הצרפתי.", "מערת טא פין, קטנה וקלה להגעה.", "הליכה בין הטרסות, ושיחה עם הנשים הרוקמות."]}, "Ben Tre coconut canals Mekong": {"hist": ["נהר המקונג יוצא מרמת טיבט, עובר בסין, מיאנמר, לאוס, תאילנד וקמבודיה, ובדרום וייטנאם מתפצל לזרועות רבות לפני שהוא נשפך לים. הדלתא שלו היא אחד האזורים הפוריים בעולם, ומכונה \"סל האורז של וייטנאם\". מחוז בן טרה בנוי מכמה איים גדולים בין ארבע זרועות של הנהר.", "בן טרה ידועה בהיסטוריה של התנגדות. ב־1960 פרץ כאן \"המרד הכללי\" (דונג קוי) נגד משטר הדרום, שנחשב לאחת מנקודות הפתיחה של המלחמה. הגיבורה המקומית, נגוין טי דין, הייתה מראשי המרד, ומאוחר יותר הפכה לאישה הראשונה בדרגת גנרל בצבא וייטנאם."], "uniq": ["בן טרה היא \"בירת הקוקוס\" של וייטנאם: דקלי קוקוס מכסים את רוב השטח, ומהם מייצרים סוכריות, שמן, פחם, מחצלות, כלי מטבח ועוד. התעלות הצרות בין המטעים, שעליהן נוטים עלי הדקלים כמו מנהרה ירוקה, הן המראה המייצג של המקום.", "בהשוואה למי טו, היעד הקלאסי בטיולי יום מסייגון, בן טרה שקטה, ירוקה וכפרית יותר. החיים מתנהלים בקצב של הנהר: סירות עמוסות פירות, ילדים שקופצים למים, ובתים עם מזח עץ קטן."], "see": ["שייט בסירה קטנה בתעלות הקוקוס, עם חותרת בכובע משולש.", "בית מלאכה לסוכריות קוקוס: רואים את כל התהליך וטועמים חמות.", "ייצור נייר אורז ואטריות אורז בעבודת יד.", "טעימת פי function drawMap(){
  const V = MAPV.find(v=>v.id===mapView);
  const [x0,y0] = merc(V.b[0],V.b[1]), [x1,y1] = merc(V.b[2],V.b[3]);
  const cw = (document.querySelector('#main')||{}).clientWidth || MAP_W;
  const W = Math.round(Math.max(Math.min(cw, MAP_W), mapView==='all'?300:560)), H = Math.round(W*(y1-y0)/(x1-x0));
  const pr = (lo,la) => { const [x,y]=merc(lo,la); return [ (x-x0)/(x1-x0)*W, H-(y-y0)/(y1-y0)*H ]; };
  const path = rings => rings.map(rg => 'M'+rg.map(p=>pr(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join('L')+'Z').join('');
  const pts = MAPP.filter(p=>p.v.includes(mapView));
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="vmap" style="${W>cw?`width:${W}px;max-width:none`:`width:100%`}" role="img" aria-label="מפה: ${V.n}"><rect width="${W}" height="${H}" class="sea"/>
    <path d="${path(GEO.NB)}" class="nb"/><path d="${path(GEO.VN)}" class="vn"/>`;
  if(mapView==='all'){
    [['סין',106.2,23.15,'cty'],['לאוס',103.3,19.6,'cty'],['תאילנד',102.55,15.6,'cty'],['קמבודיה',104.9,12.7,'cty'],

      .forEach(c=>{ const [x,y]=pr(c[1],c[2]); svg += `<text x="${x}" y="${y}" text-anchor="middle" class="cn ${c[3]}">${c[0]}</text>`; });
    const at = n => MAPP.find(p=>p.n===n && p.t==='city');
    ROUTE.forEach(r=>{ const a=pr(at(r[0]).lo,at(r[0]).la), b=pr(at(r[1]).lo,at(r[1]).la);
      svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="rt ${r[2]}"/>`; });

  }
  // markers; labels are placed after render using measured widths
  pts.forEach(p=>{ const [x,y]=pr(p.lo,p.la); const r = p.t==='city'?7:5.5;
    svg += p.t==='air' ? `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="2" fill="${MCOL[p.t]}" class="mk"/>`
         : p.t==='hotel' ? `<path d="M${x},${y-r-1.5}L${x+r+1.5},${y}L${x},${y+r+1.5}L${x-r-1.5},${y}Z" fill="${MCOL[p.t]}" class="mk"/>`
         : `<circle cx="${x}" cy="${y}" r="${r}" fill="${MCOL[p.t]}" class="mk"/>`;
    svg += `<text x="${x}" y="${y}" data-x="${x}" data-y="${y}" data-r="${r}" class="ml ${p.t}" style="font-size:${p.t==='city'?16:13.5}px">${p.n}</text>`; });
  svg += `</svg>`;
  return svg;
}
function placeLabels(){
  const svg=document.querySelector('.vmap'); if(!svg) return;
  const [,,W,H]=svg.getAttribute('viewBox').split(' ').map(Number);
  const texts=[...svg.querySelectorAll('text.ml')];
  const placed=texts.map(t=>{const x=+t.dataset.x,y=+t.dataset.y,r=+t.dataset.r+2;return [x-r,y-r,x+r,y+r];});
  svg.querySelectorAll('text.cap, text.cn').forEach(t=>{try{const b=t.getBBox();placed.push([b.x,b.y,b.x+b.width,b.y+b.height]);}catch(e){}});
  const hit=b=>placed.some(q=>!(b[2]<=q[0]||b[0]>=q[2]||b[3]<=q[1]||b[1]>=q[3]));
  texts.forEach(t=>{
    const x=+t.dataset.x,y=+t.dataset.y,fs=parseFloat(t.style.fontSize)||14;
    let w; try{ w=t.getComputedTextLength(); }catch(e){} if(!w) w=t.textContent.length*fs*0.55;
    w+=6; const h=fs+2, g=+t.dataset.r+4;
    const opts=[[x+g,y-h/2],[x-g-w,y-h/2],[x-w/2,y-g-h],[x-w/2,y+g],[x+3,y-g-h],[x+3,y+g],[x-3-w,y-g-h],[x-3-w,y+g]];
    for(let d=1; d<=6; d++){ const R=g+d*14; for(let a=0;a<16;a++){ const an=a*Math.PI/8, cx=x+Math.cos(an)*(R+w/2), cy=y+Math.sin(an)*(R+h/2); opts.push([cx-w/2,cy-h/2]); } }
    const box=o=>[o[0],o[1],o[0]+w,o[1]+h], inb=b=>b[0]>=2&&b[2]<=W-2&&b[1]>=2&&b[3]<=H-2;
    let o=opts.find(o=>inb(box(o))&&!hit(box(o)))||opts.find(o=>inb(box(o)))||opts[0];
    const b=box(o); placed.push(b);
    t.setAttribute('text-anchor','middle'); t.setAttribute('x',(b[0]+b[2])/2); t.setAttribute('y',b[1]+h*0.8);
    const near=Math.hypot((b[0]+b[2])/2-x,(b[1]+b[3])/2-y) > w/2+g+6;
    if(near){ const l=document.createElementNS('http://www.w3.org/2000/svg','line'); const cx=Math.max(b[0],Math.min(x,b[2])), cy=Math.max(b[1],Math.min(y,b[3]));
      l.setAttribute('x1',x);l.setAttribute('y1',y);l.setAttribute('x2',cx);l.setAttribute('y2',cy);l.setAttribute('class','ld'); t.before(l); }
  });
}

}

function countdown(){
  const now = new Date(), el=$('#count');
  const day = 86400000;
  let html='';
  if(now < START){ html=`<span class="chip">עוד <b>${Math.ceil((START-now)/day)}</b> ימים לטיסה</span>`; }
  else if(now <= END){ html=`<span class="chip">יום <b>${Math.floor((now-START)/day)+1}</b> מתוך 14</span>`; }
  else html='<span class="chip">חזרנו! איך היה?</span>';
  html += '<span class="chip">14 ימים · 6 תחנות</span><span class="chip">ויזה: <b>$25</b> לאדם</span>';
  el.innerHTML = html;
}

      <li><b>יוניק וייטנאם: חברה ישראלית</b>טיולים מאורגנים בקבוצות קטנות עם מדריך דובר עברית. בטיול פרטי המדריך דובר אנגלית, אז כדאי לשאול על טיול פרטי לשלושה זוגות עם מדריך בעברית.<br>טלפון: <span class="ltr sel">03-9799924</span> · מייל: <span class="ltr sel">info@unique-vietnam.co.il</span> <button class="cp" data-cp="info@unique-vietnam.co.il">העתקה</button><br><a class="ltr" href="https://unique-vietnam.co.il/" target="_blank" rel="noopener">unique-vietnam.co.il</a></li>
      <li><b>Traveling to Asia: חברה מקומית בדא נאנג, שירות בעברית</b>טיולים פרטיים עם מדריך, רכב ונהג, עם צוותים בהאנוי, בדא נאנג ובסייגון. אפשרות לכשרות: ארוחות בוקר בכלים כשרים, ארוחות ערב בבתי חב״ד, שבת ליד בית חב״ד. מופיע אצלם טיול כשר קבוצתי במרץ 2027. לשאול אם המדריך עצמו דובר עברית.<br>וואטסאפ: <span class="ltr sel">+84 708 011 128</span> · מייל: <span class="ltr sel">sales@travelingtoasia.com</span> <button class="cp" data-cp="sales@travelingtoasia.com">העתקה</button><br><a class="ltr" href="https://travelingtoasia.com/" target="_blank" rel="noopener">travelingtoasia.com</a></li>
      <li><b>אודי מאירי: יועץ לתכנון טיולים בווייטנאם</b>89 חוות דעת באתר "למטייל", ציון ממוצע 4.9. בונה מסלול אישי ואינו מוכר חבילות. מטייל אחד כתב שאודי גם הדריך את הקבוצה שלו בעברית.<br>טלפון: <span class="ltr sel">052-3354295</span><br><a href="https://www.lametayel.co.il/pois/3m2yw" target="_blank" rel="noopener">העמוד שלו באתר למטייל</a></li>
      <li><b>טיול מאורגן עם מדריך ישראלי</b>טיול של 10–14 ימים כולל טיסות עולה בערך $2,500–4,500 לאדם, בקבוצות של 15–30 משתתפים. נוח, אבל מוותרים על המסלול האישי.</li>
      <li><b>שילוב</b>מטיילים לבד לפי האפליקציה, ובימים המרכזיים (האנוי, המצודה בהואה, מי סון) שוכרים מדריך מקומי דובר אנגלית ליום אחד, דרך המלון. לשישה אנשים המחיר מתחלק.</li>
    </ul>
    <h3 class="grp">אפליקציות שכדאי להתקין</h3><ul class="list">
      <li><b>Grab</b>מוניות ורכבים במחיר קבוע מראש, בלי ויכוחים. יש גם רכבים ל־7 נוסעים.</li>
      <li><b>Google Translate</b>להוריד וייטנאמית לשימוש בלי אינטרנט. מצלמת התפריט עובדת מצוין.</li>
      <li><b>Google Maps / Maps.me</b>להוריד מפות לא מקוונות של כל עיר.</li>
      <li><b>WhatsApp</b>לקבוצה של שלושת הזוגות. הנהגים המקומיים משתמשים בעיקר ב־Zalo.</li>

    <h3 class="grp">אוכל</h3><ul class="list">
      <li><b>מנות חובה</b>פו (האנוי), בון צ׳ה (האנוי), קאו לאו (הוי אן), באן מי (הוי אן), בון בו הואה (הואה), באן שאו (סייגון).</li>
      <li><b>כשרות</b>יש בתי חב״ד בהאנוי, בסאפה ובסייגון עם ארוחות שבת. מומלץ להודיע מראש.</li>
      <li><b>רגישות לחריף או לבוטנים</b>לכתוב בווייטנאמית על פתק ולהראות למלצר.</li>
    </ul></section>`;
  }
  if(id==='pack'){
    const done = store.get('pack',{});
    const c = Object.values(done).filter(Boolean).length;
    h = `<section><h2>רשימת ציוד</h2><p class="lead">מסמנים מה כבר ארוז. הסימון נשמר במכשיר שלכם. ארוזים: <b id="pc">${c}</b> מתוך ${pack.length}</p><div class="check">`+
    pack.map((p,i)=>`<label><input type="checkbox" id="pk${i}" data-i="${i}" ${done[i]?'checked':''}><span>${p}</span></label>`).join('')+`</div></section>`;
  }
  if(id==='words'){
    h = `<section><h2>מילים שימושיות</h2><p class="lead">וייטנאמית היא שפה טונאלית, אז ההגייה כאן מקורבת. חיוך ותנועת יד עובדים תמיד.</p><div class="phr">`+
    phrases.map(p=>`<div>${p[0]}</div><div class="vn">${p[1]}<small>${p[2]}</small></div>`).join('')+`</div></section>`;
  }
  m.innerHTML = h;
  if(id==='money') bindMoney();
  if(id==='pack') bindPack();
}

function num(s){return parseFloat(String(s).replace(/[^\d.]/g,''))||0}
function fmt(n,d=0){return n.toLocaleString('en',{maximumFractionDigits:d})}
function bindMoney(){
  const v=$('#vnd'),i=$('#ils'),u=$('#usd'),ru=$('#rUsd'),ri=$('#rIls');
  const from=src=>{
    const RU=num(ru.value)||26200, RI=num(ri.value)||8550;
    let vnd = src==='v'?num(v.value):src==='i'?num(i.value)*RI:src==='u'?num(u.value)*RU:num(v.value);
    if(src!=='v') v.value=fmt(Math.round(vnd));
    if(src!=='i') i.value=fmt(vnd/RI,1);
    if(src!=='u') u.value=fmt(vnd/RU,2);
  };
  v.addEventListener('input',()=>from('v'));i.addEventListener('input',()=>from('i'));u.addEventListener('input',()=>from('u'));
  [ru,ri].forEach(x=>x.addEventListener('input',()=>{store.set('rates',{usd:num(ru.value),ils:num(ri.value)});from('x')}));
  $('#quick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;v.value=fmt(+b.dataset.v);from('v')});
  from('v');
}
function bindPack(){}
$('#main').addEventListener('click',e=>{
  const mv=e.target.closest('button[data-mv]'); if(mv){ mapView=mv.dataset.mv; $('#main').innerHTML=mapSection(); placeLabels(); return; }
  const b=e.target.closest('button.cp'); if(!b) return;
  const t=b.dataset.cp, done=()=>{b.textContent='הועתק';setTimeout(()=>b.textContent='העתקה',1500)};
  try{ navigator.clipboard.writeText(t).then(done,()=>sel(b)); }catch(err){ sel(b); }
});
function sel(b){ const sp=b.previousElementSibling; const r=document.createRange(); r.selectNodeContents(sp); const g=getSelection(); g.removeAllRanges(); g.addRange(r); }
$('#main').addEventListener('change',e=>{
    if(e.target.matches('input[data-pre]')){ const d=store.get('pre',{}); d[e.target.dataset.pre]=e.target.checked; store.set('pre',d); const el=document.getElementById('prc'); if(el) el.textContent=Object.values(d).filter(Boolean).length; return; }
    if(!e.target.matches('input[data-i]'))return;
    const d=store.get('pack',{}); d[e.target.dataset.i]=e.target.checked; store.set('pack',d);
    $('#pc').textContent=Object.values(d).filter(Boolean).length;
  });

function select(id){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  render(id); store.set('tab',id);
}
$('#tabs').innerHTML = tabs.map(t=>`<button role="tab" data-id="${t.id}">${t.l}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){select(b.dataset.id);window.scrollTo({top:0})}});
const h0 = location.hash.slice(1);
select(tabs.some(t=>t.id===h0)?h0:store.get('tab','route'));
countdown();
</script>
