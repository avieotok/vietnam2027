:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 18px}
.eyebrow{font-size:14px;letter-spacing:.06em;color:var(--jade);font-weight:700}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,52px);line-height:1.05;margin:.15em 0 .2em;text-wrap:balance}
h1 span{color:var(--lantern)}
.sub{color:var(--muted);margin:0}
.count{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.chip b{color:var(--lantern)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tabs button{flex:0 0 auto;font:inherit;font-weight:700;font-size:16px;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--jade);color:var(--bg)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
main{padding-block:20px 60px}
section h2{font-family:var(--display);font-size:28px;margin:0 0 6px}
section > p.lead{color:var(--muted);margin:0 0 18px}
.day{display:grid;grid-template-columns:64px 1fr;gap:14px;padding-block:16px;border-bottom:1px solid var(--line)}
.date{text-align:center;font-variant-numeric:tabular-nums}
.date .d{font-family:var(--display);font-size:30px;font-weight:900;line-height:1}

.day ul{margin:6px 0 0;padding-inline-start:18px}

.gems{display:grid;gap:14px}
.gem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.gem h3{margin:0 0 2px;font-size:19px}
.gem .near{color:var(--muted);font-size:14px;margin-bottom:6px}

.field label{font-size:14px;font-weight:700;color:var(--muted)}

.result{font-family:var(--display);font-size:26px;font-weight:700;color:var(--jade);font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:8px}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:14px;color:var(--muted)}
tr:last-child td{border-bottom:0}
.temp{font-weight:700}
.bar{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(to left,var(--lantern),var(--gold),var(--jade));vertical-align:middle}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.list li b{display:block}

.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--jade);flex:0 0 auto;margin-top:3px}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.phr div{padding:10px 14px;border-bottom:1px solid var(--line)}
.phr .vn{direction:ltr;text-align:left;font-weight:700;color:var(--jade)}

.note{font-size:14px;color:var(--muted);margin-top:10px}

@media (prefers-reduced-motion:no-preference){section{animation:in .25s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1}}}

.pls{margin-top:12px;display:grid;gap:8px}

.pl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pl > div:first-child{min-width:0}

.pl{display:block}

.gem .ax{border-top:1px solid var(--line);padding-top:10px}

const access = x => `<dl class="ax"><dt>מיקום</dt><dd>${x.loc}</dd><dt>איך מגיעים</dt><dd>${x.how}</dd><dt>מחיר</dt><dd><b>${x.price}</b>${x.pv?` <span class="ils">≈ ${ils(x.pv)} ₪ לאדם</span>`:''}</dd></dl>`;
const placeList = arr => arr ? `<div class="pls"><div class="plh">מקומות היום</div>${arr.map(x=>`<div class="pl"><div class="plt"><div><b>${x.he}</b> <span class="vnn">${x.vn}</span></div>${links(x.q)}</div>${access(x)}</div>`).join('')}</div>` : '';

const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function countdown(){
  const now = new Date(), el=$('#count');
  const day = 86400000;
  let html='';
  if(now < START){ html=`<span class="chip">עוד <b>${Math.ceil((START-now)/day)}</b> ימים לטיסה</span>`; }
  else if(now <= END){ html=`<span class="chip">יום <b>${Math.floor((now-START)/day)+1}</b> מתוך 14</span>`; }
  else html='<span class="chip">חזרנו! איך היה?</span>';
  html += '<span class="chip">14 ימים · 6 תחנות</span><span class="chip">ויזה: <b>$25</b> לאדם</span>';
  el.innerHTML = html;
}

     ['אתר הוויזה הרשמי','evisa.gov.vn – הגשת ויזה אלקטרונית. האתר באנגלית, יש תרגום מלא בהמשך הדף.','https://evisa.gov.vn'],

     ['שגרירות ישראל בהאנוי','מיקום על המפה.','https://www.google.com/maps/search/?api=1&query='+enc('Embassy of Israel Hanoi')]

    <h3 class="grp">כניסה וטיסות</h3><ul class="list">
      <li><b>ויזה אלקטרונית חובה</b>ישראלים צריכים ויזה מראש. מגישים באתר הרשמי evisa.gov.vn בלבד (הקישור למעלה) (יש אתרים מתחזים שגובים יותר). עלות $25 לכניסה אחת, תוקף עד 90 יום. להגיש כ־3–4 שבועות לפני.</li>
      <li><b>טיסות ישירות</b>ארקיע טסה לאנוי מינואר 2026, ואל על מוסיפה קו ישיר מ־24 באוקטובר 2026, 3 פעמים בשבוע. כדאי להשוות ולהזמין מוקדם, מרץ הוא עונת שיא.</li>

  if(id==='money') bindMoney();

}

function num(s){return parseFloat(String(s).replace(/[^\d.]/g,''))||0}
function fmt(n,d=0){return n.toLocaleString('en',{maximumFractionDigits:d})}
function bindMoney(){
  const v=$('#vnd'),i=$('#ils'),u=$('#usd'),ru=$('#rUsd'),ri=$('#rIls');
  const from=src=>{
    const RU=num(ru.value)||26200, RI=num(ri.value)||8550;
    let vnd = src==='v'?num(v.value):src==='i'?num(i.value)*RI:src==='u'?num(u.value)*RU:num(v.value);
    if(src!=='v') v.value=fmt(Math.round(vnd));
    if(src!=='i') i.value=fmt(vnd/RI,1);
    if(src!=='u') u.value=fmt(vnd/RU,2);
  };
  v.addEventListener('input',()=>from('v'));i.addEventListener('input',()=>from('i'));u.addEventListener('input',()=>from('u'));
  [ru,ri].forEach(x=>x.addEventListener('input',()=>{store.set('rates',{usd:num(ru.value),ils:num(ri.value)});from('x')}));
  $('#quick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;v.value=fmt(+b.dataset.v);from('v')});
  from('v');
}
function bindPack(){}
$('#main').addEventListener('change',e=>{
    if(!e.target.matches('input[data-i]'))return;
    const d=store.get('pack',{}); d[e.target.dataset.i]=e.target.checked; store.set('pack',d);
    $('#pc').textContent=Object.values(d).filter(Boolean).length;
  });

function select(id){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  render(id); store.set('tab',id);
}
$('#tabs').innerHTML = tabs.map(t=>`<button role="tab" data-id="${t.id}">${t.l}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){select(b.dataset.id);window.scrollTo({top:0})}});
const h0 = location.hash.slice(1);
select(tabs.some(t=>t.id===h0)?h0:store.get('tab','route'));
countdown();
</script>
